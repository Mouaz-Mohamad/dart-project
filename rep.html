<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Dashboard - Order #45</title>
  <link rel="stylesheet" href="CSS/Stayle 1.css">
  <link rel="stylesheet" href="CSS/base.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .driver-card {
      background: #ffffff;
      width: 100%; max-width: 480px;
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      padding: 20px;
    }

    /* Header */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 15px;
    }
    .status-badge {
      background: #f1f5f9; color: #475569; padding: 6px 12px;
      border-radius: 20px; font-size: 12px; font-weight: bold;
      transition: all 0.3s ease;
    }
    .status-active { background: #2563eb; color: #ffffff; }
    .status-completed { background: #16a34a; color: #ffffff; }

    /* Info Boxes */
    .info-box {
      background: #f8fafc; border-radius: 12px; padding: 15px;
      border: 1px solid #e2e8f0; margin-bottom: 15px;
    }
    .info-title { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
    .info-value { font-size: 15px; font-weight: bold; color: #0f172a; margin-bottom: 4px; }

    /* Buttons */
    .btn {
      width: 100%; padding: 12px; border-radius: 10px; font-size: 14px;
      font-weight: 600; border: none; cursor: pointer; transition: 0.2s;
      display: flex; justify-content: center; align-items: center; text-decoration: none;
    }
    .btn-go { background: #2563eb; color: #ffffff; margin-bottom: 10px; }
    .btn-go:hover { background: #1d4ed8; }
    .btn-go:disabled { background: #93c5fd; cursor: not-allowed; }
    
    .btn-complete { background: #16a34a; color: #ffffff; margin-bottom: 8px; display: none; }
    .btn-complete:hover { background: #15803d; }

    .btn-cancel { background: #ef4444; color: #ffffff; margin-bottom: 10px; display: none; }
    .btn-cancel:hover { background: #dc2626; }

    .btn-call {
      background: #ffffff; color: #0f172a; border: 1px solid #cbd5e1;
      margin-bottom: 12px;
    }
    .btn-call:hover { background: #f1f5f9; }

    /* GPS Status */
    .gps-status {
      font-size: 12px; color: #2563eb; font-weight: 500; text-align: center;
      margin-top: 10px; display: none;
    }
  </style>
</head>
<body class="dja-flexdir">
  <div class="mother">
    <main>
      <div class="driver-card">
        <!-- Header -->
        <div class="header">
          <div>
            <h2 style="font-size: 18px; color: #0f172a;">Order #ORD-45</h2>
            <span style="font-size: 12px; color: #64748b;">Courier: Ahmed Mahmoud</span>
          </div>
          <span id="orderStatus" class="status-badge">Assigned (Step 3)</span>
        </div>

        <!-- Customer Details -->
        <div class="info-box">
          <div class="info-title">Customer & Address</div>
          <div class="info-value">Moaaz Mohammed</div>
          <div id="customerAddress" style="font-size: 13px; color: #475569;">
            890 بور سعيد، الوايلي الكبير غرب، حدائق القبة، محافظة القاهرة 37VG+QG
          </div>
        </div>

        <!-- Order Items -->
        <div class="info-box">
          <div class="info-title">Items & Cash Collection</div>
          <div style="font-size: 13px; color: #475569; margin-bottom: 8px;">
            1x Black Hoodie (Dart Brand) - L<br>
            1x Blue Jeans - 32
          </div>
          <hr style="border-color: #e2e8f0; margin: 8px 0;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 13px; font-weight: 600; color: #64748b;">Collect Cash:</span>
            <span style="font-size: 16px; font-weight: bold; color: #0f172a;">EGP 1100</span>
          </div>
        </div>

        <!-- Actions -->
        <a href="tel:01000000000" class="btn btn-call">Call Customer</a>

        <!-- Control Buttons -->
        <button id="goBtn" class="btn btn-go" onclick="startCountdown()">GO (Start Delivery)</button>
        <button id="completeBtn" class="btn btn-complete" onclick="completeDelivery()">Mark as Delivered</button>
        <button id="cancelBtn" class="btn btn-cancel" onclick="cancelDelivery()">Cancel Delivery Movement</button>

        <!-- GPS Status Indicator -->
        <div id="gpsStatus" class="gps-status">
          Live GPS Tracking Enabled
        </div>
      </div> 
    </main>
    <footer id="footer" aria-label="footer."></footer>
  </div>

<script>
  let watchId = null;
  let countdownTimer = null;

  window.onload = function() {
    // 1. طلب إذن الموقع
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (position) => { console.log("GPS Permission Granted"); },
        (error) => { console.error("GPS Permission Error: ", error.message); },
        { enableHighAccuracy: true }
      );
    }

    // 2. استرجاع حالة الطلب لو المندوب رجع بالسهم من الخريطة
    const savedState = localStorage.getItem('order_45_state');
    if (savedState === 'on_the_way') {
      restoreActiveState();
    } else if (savedState === 'delivered') {
      restoreCompletedState();
    }
  };

  function startCountdown() {
    const goBtn = document.getElementById('goBtn');
    let count = 3;

    goBtn.disabled = true;
    goBtn.innerText = `Opening Maps in ${count}...`;

    countdownTimer = setInterval(() => {
      count--;
      if (count > 0) {
        goBtn.innerText = `Opening Maps in ${count}...`;
      } else {
        clearInterval(countdownTimer);
        startDelivery();
      }
    }, 1000);
  }

  function startDelivery() {
    // حفظ الحالة في المتصفح قبل الانتقال
    localStorage.setItem('order_45_state', 'on_the_way');
    
    // إعداد واجهة الصفحة
    restoreActiveState();

    // التحويل في نفس الصفحة (بدون فتح تبويب جديد)
    const addressText = document.getElementById('customerAddress').innerText.trim();
    const encodedAddress = encodeURIComponent(addressText);
    window.location.href = `https://www.google.com/maps/dir/?api=1&destination=${encodedAddress}&travelmode=driving`;
  }

  function restoreActiveState() {
    const statusBadge = document.getElementById('orderStatus');
    statusBadge.innerText = "On the Way (Step 4)";
    statusBadge.className = "status-badge status-active";

    document.getElementById('goBtn').style.display = 'none';
    document.getElementById('completeBtn').style.display = 'flex';
    document.getElementById('cancelBtn').style.display = 'flex';
    document.getElementById('gpsStatus').style.display = 'block';

    startGpsTracking();
  }

  function startGpsTracking() {
    if ("geolocation" in navigator && !watchId) {
      watchId = navigator.geolocation.watchPosition(
        (position) => {
          console.log(`Driver Lat: ${position.coords.latitude}, Lng: ${position.coords.longitude}`);
        },
        (error) => { console.error("Tracking Error: ", error.message); },
        { enableHighAccuracy: true }
      );
    }
  }

  function cancelDelivery() {
    if (countdownTimer) clearInterval(countdownTimer);
    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = null;

    localStorage.removeItem('order_45_state');

    const goBtn = document.getElementById('goBtn');
    goBtn.disabled = false;
    goBtn.innerText = "GO (Start Delivery)";

    const statusBadge = document.getElementById('orderStatus');
    statusBadge.innerText = "Assigned (Step 3)";
    statusBadge.className = "status-badge";

    document.getElementById('goBtn').style.display = 'flex';
    document.getElementById('completeBtn').style.display = 'none';
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('gpsStatus').style.display = 'none';
  }

  function completeDelivery() {
    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = null;

    localStorage.setItem('order_45_state', 'delivered');
    restoreCompletedState();
  }

  function restoreCompletedState() {
    const statusBadge = document.getElementById('orderStatus');
    statusBadge.innerText = "Delivered (Step 5)";
    statusBadge.className = "status-badge status-completed";

    document.getElementById('goBtn').style.display = 'none';
    document.getElementById('completeBtn').style.display = 'none';
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('gpsStatus').style.display = 'block';
    document.getElementById('gpsStatus').innerText = "Order Completed";
    document.getElementById('gpsStatus').style.color = "#16a34a";
  }
</script>

</body>
</html>
