<link rel="stylesheet" href="../CSS/Stayle 1.css">
<link rel="stylesheet" href="../CSS/base.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<section class="search-serial dja-flexdir margin-top" aria-label="Product Authenticity Check | التحقق من أصالة القطعة">
    <h1>Trace your unique edition</h1>
    <form class="search-container dja" id="serialSearchForm" novalidate>
        <label class="sr-only" for="serialNumber">Item serial number</label>
        <input type="text" id="serialNumber" name="serial_number" placeholder="Item code / serial number" class="search-input" required autocomplete="off" maxlength="80">
        <button type="submit" class="search-button" aria-label="Verify item authenticity">
            <i class="fas fa-search"></i>
        </button>
    </form>
    <div id="serialSearchResult" class="serial-result" role="dialog" aria-modal="true" aria-live="polite" aria-labelledby="serialResultTitle" hidden>
        <div class="serial-result-card">
            <button type="button" class="serial-result-close" aria-label="Close">&times;</button>
            <div class="serial-result-content"></div>
        </div>
    </div>
</section>
