<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../CSS/Stayle 1.css">
<link rel="stylesheet" href="../CSS/base.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">


<section class="feedback-section dja-flexdir" aria-label="Exchange or Return Request | طلب استبدال أو إرجاع">
    <h1 class="section-title">Exchange <br>or Return Request</h1>

    <form id="feedback-form" class="form">
        <div class="form-group">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" placeholder="you + Father + GrandBa" pattern="^\s*(\S+\s+){2,}\S+\s*$" required>
        </div>

        <div class="form-row flex-center">
            <div class="form-group">
                <label for="phone-number">Phone Number</label>
                <input type="tel" id="phone-number" placeholder="+20 1*********" pattern="[0-9]{11}" required>
            </div>
            <div class="form-group">
                <label for="phone-number">Phone Number 2</label>
                <input type="tel" id="phone-number" placeholder="+20 1*********" pattern="[0-9]{11}">
            </div>
        </div>


        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Value" required>
        </div>

        <div class="form-row flex-center">
            <div class="form-group">
                <label for="item-Code">Item Code</label>
                <input type="text" id="title-text" placeholder="Value" required>
            </div>
            <div class="form-group">
                <label for="model-code">Model code</label>
                <input type="text" id="title-text" placeholder="Value" required>
            </div>
        </div>
        <div class="form-row flex-center">
            <div class="container-select">
                <h4>Request Type</h4>
                <select required>
                <option value="" selected disabled hidden> Select </option>
                <option> Exchange | استبدال</option>
                <option> Refund | استرجاع</option>
            </select>
            </div>
            <div class="container-select">
                <h4>Reason for the request</h4>
                <select required>
                    <option value="" selected disabled hidden> Select </option>
                    <option value="wrong_size">المقاس غير مناسب</option>
                    <option value="defective">المنتج به عيب تصنيع أو تلف</option>
                    <option value="not_as_described">المنتج يختلف عن الصورة أو الوصف</option>
                    <option value="wrong_item">استلمت منتجًا مختلفًا عن طلبي</option>
                    
                    <!-- خيارات جودة أو تفضيل -->
                    <option value="quality_issue">خامة المنتج لم تعجبني</option>
                    <option value="changed_mind">لم أعد بحاجة إلى المنتج (تغيير رأي)</option>
                    <option value="missing_parts">يوجد نقص في محتويات الشحنة</option>
                    
                    <!-- خيار عام -->
                    <option value="other">سبب آخر</option>
            </select>
            </div>
        </div>

        <div class="form-group">
            <label for="nots">Notes</label>
            <textarea id="notes" placeholder="Value" rows="4"></textarea>
        </div>


        <button type="submit" class="submit-btn-form">Submit</button>
    </form>
</section>

    <script src="../Js/one .js"></script>
