<!-- DART CODE GUIDE | sections/form-contact.html
     الغرض: نموذج تواصل خادمي؛ احتفظ بمعرف contactForm وأسماء الحقول لتوافق /api/v1/contact. -->
<section class="feedback-section dja-flexdir dart-contact-form-section" aria-label="Contact Us | اتصل بنا">
    <form id="contactForm" class="form dart-contact-form">
        <div class="form-group">
            <label for="contact-full-name">Full Name <span aria-hidden="true">*</span></label>
            <input type="text" id="contact-full-name" name="full_name" placeholder="اسمك بالكامل" minlength="3" maxlength="120" autocomplete="name" required>
        </div>
        <div class="form-row flex-center">
            <div class="form-group">
                <label for="contact-phone-1">Phone Number <span aria-hidden="true">*</span></label>
                <input type="tel" id="contact-phone-1" name="phone1" placeholder="01xxxxxxxxx" pattern="01[0125][0-9]{8}" inputmode="tel" autocomplete="tel" required>
            </div>
            <div class="form-group">
                <label for="contact-email">Email <span aria-hidden="true">*</span></label>
                <input type="email" id="contact-email" name="email" placeholder="you@example.com" autocomplete="email" maxlength="254" required>
            </div>
        </div>
        <div class="form-group">
            <label for="contact-message">Your Message <span aria-hidden="true">*</span></label>
            <textarea id="contact-message" name="message" placeholder="احكيلنا محتاج إيه..." rows="5" maxlength="5000" required></textarea>
        </div>
        <details class="dart-contact-extra">
            <summary lang="ar" dir="rtl">إضافة رقم تليفون آخر (اختياري) <i class="fa-solid fa-chevron-down" aria-hidden="true"></i></summary>
            <div class="form-group">
                <label for="contact-phone-2">Alternative Phone Number</label>
                <input type="tel" id="contact-phone-2" name="phone2" placeholder="01xxxxxxxxx" pattern="01[0125][0-9]{8}" inputmode="tel" autocomplete="tel">
            </div>
        </details>
        <button type="submit" class="submit-btn-form dart-contact-submit">Send Message <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
    </form>
</section>
