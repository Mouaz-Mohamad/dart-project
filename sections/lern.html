<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المتجر الإلكتروني | الرئيسية</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Reset & Base */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0b0b; color: #fff; padding: 40px 20px; line-height: 1.6; }
    
    .section-title {
      font-size: 22px;
      margin-bottom: 20px;
      color: #fff;
      border-left: 4px solid #902139;
      padding-right: 10px;
    }

    /* 1. قسم المنتجات */
    .products-section { max-width: 1200px; margin: 0 auto 60px auto; }
    
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #121212;
      border: 1px solid #2a0a10;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: #902139;
    }

    .product-img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background-color: #1a1a1a;
    }

    .product-details { padding: 12px; }

    /* نوع المنتج */
    .product-category {
      font-size: 11px;
      color: #e27d8e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .product-title {
      font-size: 15px;
      color: #fff;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .product-code {
      font-size: 12px;
      color: #777;
      margin-bottom: 12px;
    }

    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-price {
      font-size: 15px;
      font-weight: bold;
      color: #fff;
    }

    .cart-btn {
      background: transparent;
      border: 1px solid #902139;
      color: #902139;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .cart-btn:hover { background: #902139; color: #fff; }

    /* 2. قسم التقييمات */
    .reviews-section { max-width: 1200px; margin: 0 auto; }
    
    .reviews-container {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding: 10px 5px;
    }

    .review-card {
      min-width: 260px;
      max-width: 280px;
      border: 1px solid #2a0a10;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #121212;
      flex-shrink: 0;
    }

    .stars { color: #d4a307; font-size: 13px; margin-bottom: 8px; }
    .review-title { font-size: 14px; font-weight: bold; margin-bottom: 6px; color: #fff; }
    .review-text { font-size: 12px; color: #aaa; line-height: 1.5; margin-bottom: 15px; }

    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #222; }
    .user-name { font-size: 13px; font-weight: bold; color: #eee; }
    .review-date { font-size: 10px; color: #666; }
  </style>
</head>
<body>

  <!-- ================= سكشن المنتجات ================= -->
<section class="products-section">
    <h2 class="section-title">أحدث المنتجات</h2>
    
    <div class="products-grid" id="productsContainer">
    <!-- الكارت المرجعي (Template) -->
    <div class="product-card" id="productTemplate" style="display: none;">
        <img src="" alt="" class="product-img">
        <div class="product-details">
        <div class="product-category"></div>
        <div class="product-title"></div>
        <div class="product-code"></div>
        <div class="product-footer">
            <button class="cart-btn"><i class="fa-solid fa-bag-shopping"></i></button>
            <span class="product-price"></span>
        </div>
        </div>
    </div>
    </div>
</section>

  <!-- ================= سكشن التقييمات ================= -->
  <section class="reviews-section">
    <h2 class="section-title">آراء العملاء</h2>

    <div class="reviews-container" id="reviewsContainer">
      <!-- الكارت المرجعي (Template) -->
      <div class="review-card" id="reviewTemplate" style="display: none;">
        <div>
          <div class="stars"></div>
          <div class="review-title"></div>
          <div class="review-text"></div>
        </div>
        <div class="user-info">
          <img src="" alt="" class="user-avatar">
          <div>
            <div class="user-name"></div>
            <div class="review-date"></div>
          </div>
        </div>
      </div>
    </div>
  </section>


  <script>
    // ==========================================
    // 1. مصفوفة المنتجات (أنواع مختلفة)
    // ==========================================
    const productsData = [
      { category: "قمصان", title: "قميص جينز | بيج", code: "DA-T695", price: 849, image: "../Photos/card.png" },
      { category: "بناطيل", title: "بنطلون جينز | كاكاوى", code: "DA-P785", price: 480, image: "https://via.placeholder.com/220x240" },
      { category: "جواكت", title: "جاكت مبطن فرو | كافيه", code: "DA-J102", price: 1200, image: "https://via.placeholder.com/220x240" },
      { category: "تيشيرتات", title: "تيشيرت أوفر سايز | أسود", code: "DA-TS44", price: 350, image: "https://via.placeholder.com/220x240" },
      { category: "سويتشيرت", title: "هودي ثقيل | زيتوني", code: "DA-H901", price: 650, image: "https://via.placeholder.com/220x240" },
      { category: "بناطيل", title: "بنطلون ميلتون | رصاصي", code: "DA-P112", price: 420, image: "https://via.placeholder.com/220x240" },
      { category: "قمصان", title: "قميص كاروهات | أزرق", code: "DA-T332", price: 590, image: "https://via.placeholder.com/220x240" },
      { category: "جواكت", title: "جاكت بومبر | أسود", code: "DA-J505", price: 950, image: "https://via.placeholder.com/220x240" },
      { category: "إكسسوارات", title: "كاب مطرز | أبيض", code: "DA-C011", price: 180, image: "https://via.placeholder.com/220x240" },
      { category: "تيشيرتات", title: "تيشيرت بولو | بني", code: "DA-TS88", price: 390, image: "https://via.placeholder.com/220x240" },
      { category: "سويتشيرت", title: "سويت شيرت بياقة | كحلي", code: "DA-H220", price: 580, image: "https://via.placeholder.com/220x240" },
      { category: "أحذية", title: "سنيكرز كاجوال | أبيض", code: "DA-S999", price: 790, image: "https://via.placeholder.com/220x240" },
      // منتج رقم 13 و 14 لضمان إن الصفحة الرئيسية بتاخد 12 بس
      { category: "بناطيل", title: "بنطلون كارجو | زيتي", code: "DA-P303", price: 520, image: "https://via.placeholder.com/220x240" },
      { category: "قمصان", title: "قميص كتان | أبيض", code: "DA-T800", price: 620, image: "https://via.placeholder.com/220x240" }
    ];

    // عناصر المنتجات
    const productsContainer = document.getElementById('productsContainer');
    const productTemplate = document.getElementById('productTemplate');

    // أخذ أول 12 منتج فقط للعرض في index.html
    const mainPageProducts = productsData.slice(0, 12);

    mainPageProducts.forEach(item => {
      const card = productTemplate.cloneNode(true);
      card.removeAttribute('id');
      card.style.display = 'flex';

      card.querySelector('.product-img').src = item.image;
      card.querySelector('.product-img').alt = item.title;
      card.querySelector('.product-category').textContent = item.category; // إضافة النوع
      card.querySelector('.product-title').textContent = item.title;
      card.querySelector('.product-code').textContent = `كود : ${item.code}`;
      card.querySelector('.product-price').textContent = `EGP ${item.price}`;

      productsContainer.appendChild(card);
    });


    // ==========================================
    // 2. مصفوفة التقييمات (عرض بالكامل)
    // ==========================================
    const reviewsData = [
      {
        name: "سارة محمود",
        date: "15 يوليو 2026",
        rating: 5,
        title: "خامة ممتازة وتقفيل محترم",
        comment: "القماش مريح جداً في اللبس والتقفيل نضيف مفيش خيوط طالعة.",
        avatar: "https://via.placeholder.com/40"
      },
      {
        name: "خالد علي",
        date: "10 يوليو 2026",
        rating: 5,
        title: "شيك ومريح جداً",
        comment: "التصميم جميل وعصري والألوان نفس الصور بالظبط والتوصيل سريع.",
        avatar: "https://via.placeholder.com/40"
      },
      {
        name: "أحمد حسام",
        date: "02 يوليو 2026",
        rating: 4,
        title: "مقاس مظبوط خامة جيدة",
        comment: "الخامة جيدة جداً بالنسبة للسعر والمقاس جه مظبوط بظبط.",
        avatar: "https://via.placeholder.com/40"
      },
      {
        name: "مريم إبراهيم",
        date: "28 يونيو 2026",
        rating: 5,
        title: "خدمة عملاء رائعة",
        comment: "المنتج ممتاز والتغليف شيك جداً، هطلب منكم تاني أكيد.",
        avatar: "https://via.placeholder.com/40"
      }
    ];

    // عناصر الريفيوز
    const reviewsContainer = document.getElementById('reviewsContainer');
    const reviewTemplate = document.getElementById('reviewTemplate');

    // عرض جميع التقييمات بدون slice
    reviewsData.forEach(item => {
      const card = reviewTemplate.cloneNode(true);
      card.removeAttribute('id');
      card.style.display = 'flex';

      // رسم النجوم
      const starsContainer = card.querySelector('.stars');
      starsContainer.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('i');
        star.className = i <= item.rating ? 'fa-solid fa-star' : 'fa-regular fa-star';
        starsContainer.appendChild(star);
      }

      card.querySelector('.review-title').textContent = item.title;
      card.querySelector('.review-text').textContent = item.comment;
      card.querySelector('.user-avatar').src = item.avatar;
      card.querySelector('.user-avatar').alt = item.name;
      card.querySelector('.user-name').textContent = item.name;
      card.querySelector('.review-date').textContent = item.date;

      reviewsContainer.appendChild(card);
    });
  </script>
</body>
</html>
