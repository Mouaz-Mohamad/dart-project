<!DOCTYPE html>
<!-- DART CODE GUIDE | track.html
     الغرض: صفحة HTML تشغيلية؛ الهيكل ثابت والمنطق الديناميكي موجود في ملفات JavaScript المرتبطة. -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="192x192" href="Photos/192px.png">
  <title>تتبع طلبك | Dart</title>
  <meta name="robots" content="noindex,nofollow">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Condensed:wght@400;600&family=Irish+Grover&family=Readex+Pro:wght@200;300;500;700&display=swap" rel="stylesheet">
</head>
<body class='dja-flexdir'>
    <div class="mother">
      <header id="header-container" aria-label="Main Navigation"></header>

      <main>
<div id="orderTrackingList" class="order-tracking-list"></div>

<template id="order-tracking-card-template">
  <article class="tracking-card" data-order-tracking-card>
    <div class="tracking-map-shell is-disabled" data-order-map-shell>
      <div class="tracking-order-map" data-order-map aria-label="Live delivery map"></div>
      <div class="tracking-map-disabled" data-order-map-disabled>Representative not assigned yet</div>
    </div>
    <div class="tracking-map-summary" data-order-map-summary role="status">Delivery location has not been activated.</div>
    <div class="content">
      <div class="order-header"><div><div class="order-id" data-order-field="id"></div><div class="tracking-order-date" data-order-field="date"></div></div><div class="eta-badge" data-order-eta>ETA: Not determined</div></div>
      <div class="stepper">
        <div class="stepper-progress" data-order-progress></div>
        <div class="step" data-order-step="0"><div class="circle">1</div><span class="step-text">Confirmed</span></div>
        <div class="step" data-order-step="1"><div class="circle">2</div><span class="step-text">Preparing</span></div>
        <div class="step" data-order-step="2"><div class="circle">3</div><span class="step-text">Picked Up</span></div>
        <div class="step" data-order-step="3"><div class="circle">4</div><span class="step-text">On the Way</span></div>
        <div class="step" data-order-step="4"><div class="circle">5</div><span class="step-text">Delivered</span></div>
      </div>
      <div class="items-box empty-state" data-order-items></div>
      <div class="driver-box"><div><div data-order-field="representative"></div><div data-order-field="representativeMeta"></div></div><a href="#" class="btn-call" data-order-call hidden>Call</a></div>
    </div>
  </article>
</template>

<template id="order-tracking-unit-template">
  <section class="dart-tracked-order-unit" data-order-unit>
    <div class="dart-tracked-unit-head"><strong data-order-unit-field="id"></strong><span data-order-unit-field="status"></span></div>
    <small data-order-unit-field="date"></small>
    <div data-order-unit-lines></div>
    <div class="item-row tracking-final-row"><span>Total</span><strong data-order-unit-field="total"></strong></div>
  </section>
</template>

<template id="order-tracking-line-template">
  <div class="item-row"><span data-order-line-field="description"></span><strong data-order-line-field="amount"></strong></div>
</template>

<template id="tracking-unit-divider-template"><hr class="dart-tracking-order-divider"></template>

<template id="order-tracking-empty-template">
  <div class="tracking-card empty-state">لا يوجد أوردر نشط مطابق. الأوردر المستلم يختفي من التتبع النشط ويظل في حسابك.</div>
</template>

<section id="returnTrackingSection" class="return-tracking-section" aria-labelledby="returnTrackingTitle">
  <div class="return-tracking-heading">
    <span>RETURNS &amp; EXCHANGES</span>
    <h2 id="returnTrackingTitle">متابعة الاستبدال والاسترجاع</h2>
  </div>
  <div id="returnTrackingList" class="return-tracking-list"></div>
</section>

<template id="return-tracking-card-template">
  <article class="tracking-card return-tracking-card" data-return-tracking-card>
    <div class="tracking-map-shell is-disabled" data-return-map-shell>
      <div class="return-tracking-map" data-return-map aria-label="خريطة استلام المرتجع"></div>
      <div class="tracking-map-disabled" data-return-map-disabled>بانتظار تعيين المندوب</div>
    </div>
    <div class="tracking-map-summary" data-return-map-summary role="status"></div>
    <div class="content">
      <div class="order-header">
        <div><div class="order-id" data-return-field="id"></div><div class="tracking-return-date" data-return-field="date"></div></div>
        <div class="eta-badge" data-return-field="status"></div>
      </div>
      <div class="stepper return-stepper">
        <div class="stepper-progress" data-return-progress></div>
        <div class="step" data-return-step="review"><div class="circle">1</div><span class="step-text">جاري المراجعة</span></div>
        <div class="step" data-return-step="approval"><div class="circle">2</div><span class="step-text">تم قبول الطلب</span></div>
        <div class="step" data-return-step="onway"><div class="circle">3</div><span class="step-text">المندوب في الطريق</span></div>
        <div class="step" data-return-step="received"><div class="circle">4</div><span class="step-text">تم استلام المرتجع</span></div>
      </div>
      <div class="items-box empty-state return-tracking-details" data-return-items></div>
      <div class="driver-box">
        <div><div class="return-rep-name" data-return-field="representative"></div><div class="return-rep-meta" data-return-field="representativeMeta"></div></div>
        <a href="#" class="btn-call" data-return-call hidden>اتصال</a>
      </div>
    </div>
  </article>
</template>

<template id="return-tracking-unit-template">
  <section class="dart-tracked-order-unit" data-return-unit>
    <div class="dart-tracked-unit-head"><strong data-return-unit-field="id"></strong><span data-return-unit-field="status"></span></div>
    <div class="item-row"><span>النوع</span><strong data-return-unit-field="type"></strong></div>
    <div class="item-row"><span>القطعة الأصلية</span><strong data-return-unit-field="originalItem"></strong></div>
    <div class="item-row" data-return-unit-replacement><span>القطعة البديلة</span><strong data-return-unit-field="replacementItem"></strong></div>
    <div class="item-row"><span>السعر الصافي الأصلي</span><strong data-return-unit-field="netAmount"></strong></div>
    <div class="item-row"><span>رسوم العميل للمندوب</span><strong data-return-unit-field="courierFee"></strong></div>
    <div class="item-row" data-return-unit-rejection hidden><span>سبب الرفض</span><strong data-return-unit-field="rejectionReason"></strong></div>
  </section>
</template>

<template id="return-tracking-empty-template">
  <div class="empty-state">لا يوجد طلب استبدال أو استرجاع نشط. الطلب المكتمل يظل محفوظًا في سجل الحساب والداشبورد.</div>
</template>
      </main>

      <footer id="footer" aria-label="footer."></footer>

    </div>
<!-- Leaflet JS -->
  <!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script  src="Js/dart-state.js" defer></script>
    <script  src="Js/dart-site-settings.js" defer></script>
<script  src="Js/dart-groups.js" defer></script>
<script  src="Js/dart-catalog.js" defer></script>
<script  src="Js/dart-returns.js" defer></script>
    <script  src="Js/dart-ui.js" defer></script>
    <script  src="Js/dart-storefront.js" defer></script>
<script  src="Js/dart-platform.js" defer></script>
<script  src="Js/dart-tracking.js" defer></script>

</body>
</html>
