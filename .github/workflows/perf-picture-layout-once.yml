name: One-time picture fallback layout guard

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/perf-picture-layout-once.yml"

permissions:
  contents: write

jobs:
  picture-layout-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Keep picture wrappers layout-neutral
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('CSS/base.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* BEGIN WebP picture layout guard */'
          if marker not in s:
              s += '\n\n/* BEGIN WebP picture layout guard */\npicture.dart-picture { display: contents; }\n/* END WebP picture layout guard */\n'
              p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          node tests/performance-budget.cjs
      - name: Commit guard and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/perf-picture-layout-once.yml
          git config user.name "Dart Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep WebP picture wrappers layout neutral"
          git push origin HEAD:main
