name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "Eye/**"
      - "Js/**"
      - "CSS/**"
      - "sections/**"
      - "sw.js"
      - "manifest.json"
      - ".github/workflows/frontend-ci.yml"
      - "tests/**"
  pull_request:
    paths:
      - "*.html"
      - "Eye/**"
      - "Js/**"
      - "CSS/**"
      - "sections/**"
      - "sw.js"
      - "manifest.json"
      - ".github/workflows/frontend-ci.yml"
      - "tests/**"

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find Eye Js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
      - name: Frontend regression contracts
        run: |
          node tests/database-authoritative-storage.cjs
          node tests/auth-contract.js
          node tests/performance-budget.cjs
          node tests/dart-finance-unit.js
          node tests/finance-dashboard-contract.js
          node tests/server-authority-contract.js

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Full storefront and dashboard Chromium smoke
        run: node tests/full-site-browser.js
