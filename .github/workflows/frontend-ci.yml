# DART CODE GUIDE | .github/workflows/frontend-ci.yml
# الغرض: فحص JavaScript واختبارات العقود وChromium smoke للموقع والداشبورد.
name: Frontend CI

on:
  push:
    branches: [main, full-code-cleanup]
    tags: [dart-review-*]
    paths:
      - "*.html"
      - "Eye/**"
      - "Js/**"
      - "api/**"
      - "CSS/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "sections/**"
      - "sw.js"
      - "push-sw.js"
      - "manifest.json"
      - "vercel.json"
      - ".github/workflows/frontend-ci.yml"
      - "tests/**"
      - "backend/src/modules/finance/**"
      - "backend/src/modules/dashboard/**"
      - "backend/migrations/**"
  pull_request:
    paths:
      - "*.html"
      - "Eye/**"
      - "Js/**"
      - "api/**"
      - "CSS/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "sections/**"
      - "sw.js"
      - "push-sw.js"
      - "manifest.json"
      - "vercel.json"
      - ".github/workflows/frontend-ci.yml"
      - "tests/**"
      - "backend/src/modules/finance/**"
      - "backend/src/modules/dashboard/**"
      - "backend/migrations/**"

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install frontend build tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild homepage CSS delivery bundle
        run: |
          node scripts/build-home-css.cjs
          node scripts/build-home-runtime.cjs
          node scripts/stage-vercel-public.cjs
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find Eye Js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          node --check push-sw.js
      - name: Frontend regression contracts
        run: |
          node scripts/check-source-layout.cjs
          node tests/source-layout-contract.cjs
          node tests/css-cascade-contract.cjs
          node tests/custom-domain-runtime.cjs
          node tests/customer-notifications-runtime.cjs
          node tests/database-authoritative-storage.cjs
          node tests/cache-revalidation-contract.cjs
          node tests/auth-contract.js
          node tests/address-unit.js
          node tests/security-boundaries.cjs
          node tests/performance-budget.cjs
          node tests/news-loader.cjs
          node tests/news-seo.cjs
          node tests/home-performance-contract.cjs
          node tests/public-feedback-contract.cjs
          node tests/modal-placement-contract.cjs
          node tests/order-action-latency-contract.cjs
          node tests/product_deep_links.cjs
          node tests/product_ssr_seo.cjs
          node tests/seo_checks.js
          node tests/catalog-category-contract.js
          node tests/council-browser-runtime.cjs
          node tests/council-third-runtime.cjs
          node tests/council-fourth-runtime.cjs
          node tests/dart-finance-unit.js
          node tests/finance-dashboard-contract.js
          node tests/finance-persistence-contract.js
          node tests/finance-state-integration.cjs
          node tests/finance-ui-runtime.cjs
          node tests/dashboard-refresh-runtime.cjs
          node tests/server-authority-contract.js
          node tests/settings-and-groups-unit.js
          node tests/settings-reset-unit.js
          node tests/founder-media-runtime.cjs
          node tests/promotion-settings-contract.js
          node tests/product-button-state-contract.cjs
          node tests/product-modal-shared-contract.cjs
          node tests/profile-compact-records.cjs
          node tests/sets-runtime-contract.cjs
          node tests/test-inventory-contract.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install frontend build tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild homepage CSS delivery bundle
        run: |
          node scripts/build-home-css.cjs
          node scripts/build-home-runtime.cjs
          node scripts/stage-vercel-public.cjs
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-chromium-v1
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Full storefront and dashboard Chromium smoke
        run: |
          DART_CSS_BASE_REF=HEAD^ node tests/css-cascade-browser.cjs
          node tests/dashboard-groups-browser.cjs
          node tests/brand-details-browser.cjs
          node tests/navigation-browser.cjs
          node tests/product-waiting-browser.js
          node tests/sets-admin-browser.js
          node tests/sets-home-browser.js
          node tests/sets-storefront-browser.js
          node tests/home-storefront-browser.js
          node tests/news-browser.cjs
          node tests/customer-notifications-browser.cjs
          node tests/coming-soon-browser.cjs
          node tests/storefront-settings-regression.js
          node tests/full-site-browser.js
