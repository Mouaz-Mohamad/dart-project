name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "Eye/**"
      - "Js/**"
      - "sw.js"
      - ".github/workflows/frontend-ci.yml"
      - "tests/**"
  pull_request:
    paths:
      - "Eye/**"
      - "Js/**"
      - "sw.js"
      - ".github/workflows/frontend-ci.yml"
      - "tests/**"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find Eye Js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
      - name: Frontend regression contracts
        run: |
          node tests/dart-finance-unit.js
          node tests/finance-dashboard-contract.js
          node tests/server-authority-contract.js
