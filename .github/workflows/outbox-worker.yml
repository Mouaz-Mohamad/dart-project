name: Durable outbox worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dart-outbox-worker
  cancel-in-progress: false
jobs:
  process:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Process committed events and bounded maintenance
        env:
          DART_OUTBOX_CRON_SECRET: ${{ secrets.DART_OUTBOX_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$DART_OUTBOX_CRON_SECRET"
          response_file="$(mktemp)"
          trap 'rm -f -- "$response_file"' EXIT
          deadline=$((SECONDS + 90))
          delivery_issues=0
          for batch in $(seq 1 12); do
            remaining=$((deadline - SECONDS))
            if (( remaining < 1 )); then break; fi
            timeout=$((remaining < 50 ? remaining : 50))
            curl --silent --show-error --fail --max-time "$timeout" --request POST \
              --header "Authorization: Bearer $DART_OUTBOX_CRON_SECRET" \
              --output "$response_file" \
              "https://dart-api-dusky.vercel.app/api/v1/internal/outbox/process?limit=5"
            result="$(node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          for (const field of ['claimed', 'published', 'failed', 'uncertain', 'terminal']) {
            result[field] ??= 0;
            if (!Number.isInteger(result[field]) || result[field] < 0 || result[field] > 5) {
              throw new Error('Invalid outbox worker result');
            }
          }
          const health = result.health;
          if (!health || ['uncertain', 'exhausted', 'terminal'].some(field => !Number.isInteger(health[field]) || health[field] < 0)) {
            throw new Error('Missing outbox backlog health');
          }
          process.stdout.write(`${result.claimed} ${result.failed + result.uncertain + result.terminal + health.uncertain + health.exhausted + health.terminal}`);
          NODE
            )"
            read -r claimed issues <<< "$result"
            delivery_issues=$((delivery_issues + issues))
            if (( claimed == 0 )); then break; fi
          done
          if (( delivery_issues > 0 )); then
            echo "Outbox completed with $delivery_issues delivery issues requiring review"
            exit 1
          fi
