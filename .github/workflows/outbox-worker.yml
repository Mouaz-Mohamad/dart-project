name: Durable outbox worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dart-outbox-worker
  cancel-in-progress: false
jobs:
  process:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout scheduler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: scripts/background-schedule.mjs
          sparse-checkout-cone-mode: false
      - name: Check schedule without contacting the API
        id: schedule
        env:
          DART_BACKGROUND_POLICY: ${{ vars.DART_BACKGROUND_POLICY }}
          DART_MANUAL_RUN: 'false' # Direct manual sends use the audited dashboard action.
        run: node scripts/background-schedule.mjs outbox
      - name: Process committed events and bounded maintenance
        if: steps.schedule.outputs.run == 'true'
        env:
          DART_POLICY_REVISION: ${{ steps.schedule.outputs.revision }}
          DART_OUTBOX_CRON_SECRET: ${{ secrets.DART_OUTBOX_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$DART_OUTBOX_CRON_SECRET"
          response_file="$(mktemp)"
          trap 'rm -f -- "$response_file"' EXIT
          deadline=$((SECONDS + 90))
          delivery_issues=0
          maintenance_issues=0
          pending_overdue=0
          for batch in $(seq 1 12); do
            remaining=$((deadline - SECONDS))
            if (( remaining < 1 )); then break; fi
            timeout=$((remaining < 50 ? remaining : 50))
            curl --silent --show-error --fail --max-time "$timeout" --request POST \
              --header "x-dart-policy-revision: $DART_POLICY_REVISION" \
              --header "Authorization: Bearer $DART_OUTBOX_CRON_SECRET" \
              --output "$response_file" \
              "https://dart-api-dusky.vercel.app/api/v1/internal/outbox/process?limit=5"
            result="$(node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (result.skipped) {
            if (result.reason === 'policy_revision_mismatch') throw new Error('Scheduler policy is out of sync; save the dashboard settings again');
            process.stdout.write('0 0 0 0'); process.exit(0);
          }
          for (const field of ['claimed', 'published', 'failed', 'uncertain', 'terminal']) {
            result[field] ??= 0;
            if (!Number.isInteger(result[field]) || result[field] < 0 || result[field] > 5) {
              throw new Error('Invalid outbox worker result');
            }
          }
          const health = result.health;
          // Compatibility while the API deployment for this field is rolling out.
          if (health) health.deliveryFailed ??= 0;
          if (!health || ['uncertain', 'exhausted', 'terminal', 'duePending', 'oldestDueSeconds'].some(field => !Number.isInteger(health[field]) || health[field] < 0)) {
            throw new Error('Missing outbox backlog health');
          }
          const overdue = health.duePending > 0 && health.oldestDueSeconds >= 900 ? 1 : 0;
          if (!Number.isInteger(health.deliveryFailed) || health.deliveryFailed < 0) throw new Error('Invalid delivery failure health');
          const maintenance = result.maintenance;
          const maintenanceFailure = maintenance?.ok === false ? 1 : 0;
          process.stdout.write(`${result.claimed} ${result.failed + result.uncertain + result.terminal + health.uncertain + health.exhausted + health.terminal + health.deliveryFailed} ${overdue} ${maintenanceFailure}`);
          NODE
            )"
            read -r claimed issues pending_overdue maintenance_failure <<< "$result"
            delivery_issues=$((delivery_issues + issues))
            maintenance_issues=$((maintenance_issues + maintenance_failure))
            if (( claimed == 0 )); then break; fi
          done
          if (( delivery_issues + pending_overdue + maintenance_issues > 0 )); then
            echo "Outbox completed with $delivery_issues delivery issues, $pending_overdue overdue backlog alerts and $maintenance_issues maintenance failures requiring review"
            exit 1
          fi
