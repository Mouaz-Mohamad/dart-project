name: One-time defer optimization

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/perf-step2-defer-once.yml"

permissions:
  contents: write

jobs:
  defer-local-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add defer to local Js scripts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/perf_step2_defer.py
          git diff --check
          node tests/performance-budget.cjs
      - name: Commit step 2
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/perf-step2-defer-once.yml
          rm scripts/perf_step2_defer.py
          git config user.name "Dart Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: defer local storefront scripts"
          git push origin HEAD:main
