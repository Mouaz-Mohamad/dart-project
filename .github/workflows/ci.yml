# DART CODE GUIDE | .github/workflows/ci.yml
# الغرض: بوابة CI موحدة للـBackend تعمل على كل push وpull request وتفشل عند أي كسر.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dart
          POSTGRES_PASSWORD: dart
          POSTGRES_DB: dart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dart -d dart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://dart:dart@127.0.0.1:5432/dart_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript type-check
        run: npm run typecheck

      - name: Lint backend
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Run backend unit, contract, integration and security tests
        run: npm test

      - name: Run repository security-boundary checks
        working-directory: .
        run: node tests/security-boundaries.cjs

      - name: Enforce database-authoritative browser storage
        working-directory: .
        run: node tests/database-authoritative-storage.cjs
