name: Apply customer password policy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-customer-password-6]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply approved customer password policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {found}: {old[:80]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          # Customer policy: 6+ alphanumeric chars, at least one letter and one digit.
          replace(
              'backend/src/security/password.ts',
              '''// Customers and representatives intentionally share one password contract.\n// Staff access remains on its separate passwordless/onboarding flow.\nexport function validateCustomerPasswordPolicy(password: string): string[] {\n  return validatePasswordPolicy(password);\n}\n''',
              '''// Customer passwords are intentionally simple for the storefront: at least\n// six alphanumeric characters with both a letter and a number. Representative\n// accounts keep the stronger operational password policy above.\nexport function validateCustomerPasswordPolicy(password: string): string[] {\n  const problems: string[] = [];\n  if (password.length < 6) problems.push("Password must contain at least 6 characters");\n  if (!/[A-Za-z]/.test(password)) problems.push("Password must contain a letter");\n  if (!/[0-9]/.test(password)) problems.push("Password must contain a number");\n  if (!/^[A-Za-z0-9]+$/.test(password)) problems.push("Password may contain letters and numbers only");\n  return problems;\n}\n'''
          )

          replace(
              'backend/src/modules/identity/identity.routes.ts',
              'const customerPassword = z.string().min(8).max(200);\nconst password = z.string().min(12).max(200);',
              '''const customerPassword = z\n  .string()\n  .min(6)\n  .max(200)\n  .regex(\n    /^(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]+$/,\n    "Password must be at least 6 characters and contain letters and numbers only",\n  );\nconst passwordCandidate = z.string().min(6).max(200);\nconst password = z.string().min(12).max(200);'''
          )
          replace(
              'backend/src/modules/identity/identity.routes.ts',
              '''        challengeId: uuid,\n        code: z.string().regex(/^\\d{6}$/),\n        password: customerPassword,\n        confirmation: customerPassword,''',
              '''        challengeId: uuid,\n        code: z.string().regex(/^\\d{6}$/),\n        password: passwordCandidate,\n        confirmation: passwordCandidate,'''
          )
          replace(
              'backend/src/modules/identity/identity.routes.ts',
              '.object({ password: customerPassword, confirmation: customerPassword })',
              '.object({ password: passwordCandidate, confirmation: passwordCandidate })'
          )

          replace(
              'backend/src/modules/identity/identity.service.ts',
              'throw new AppError(422, "WEAK_PASSWORD", "Password must contain at least 4 characters", problems);',
              'throw new AppError(422, "WEAK_PASSWORD", "Password must be at least 6 characters and contain letters and numbers", problems);'
          )

          # Storefront sign-up guidance + native validation used by form.checkValidity().
          replace(
              'Sign Up modern.html',
              '''        .container p {\n            font-size: 12px;\n            margin: 8px 0;\n        }''',
              '''        .container p {\n            font-size: 12px;\n            margin: 8px 0;\n        }\n\n        .password-rule {\n            width: 85%;\n            margin: -6px auto 8px !important;\n            text-align: left;\n            color: #666;\n            font-size: 11px !important;\n            line-height: 1.35;\n        }'''
          )
          replace(
              'Sign Up modern.html',
              '''                    <input type="password" name="password" placeholder="Password (8+ characters)" autocomplete="new-password" minlength="8" required>''',
              '''                    <input type="password" name="password" placeholder="Password (6+ letters & numbers)" autocomplete="new-password" minlength="6" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,}" title="Use at least 6 characters with both letters and numbers." required>'''
          )
          replace(
              'Sign Up modern.html',
              '''                    <svg class="dart-auth-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>\n                </div>\n\n                <div class="input-box">\n                    <input type="date" name="birthday"''',
              '''                    <svg class="dart-auth-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>\n                </div>\n                <p class="password-rule">6+ characters — use a mix of letters and numbers.</p>\n\n                <div class="input-box">\n                    <input type="date" name="birthday"'''
          )
          replace(
              'Sign Up modern.html',
              '''<label>New password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>\n            <label>Confirm new password<input type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required></label>''',
              '''<label>New password<input type="password" name="password" minlength="6" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,}" autocomplete="new-password" required></label>\n            <label>Confirm new password<input type="password" name="confirmPassword" minlength="6" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,}" autocomplete="new-password" required></label>'''
          )

          replace(
              'profile.html',
              '''<label>New password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>\n                        <label>Confirm new password<input type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required></label>''',
              '''<label>New password<input type="password" name="password" minlength="6" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,}" title="Use at least 6 characters with both letters and numbers." autocomplete="new-password" required></label>\n                        <label>Confirm new password<input type="password" name="confirmPassword" minlength="6" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,}" title="Use at least 6 characters with both letters and numbers." autocomplete="new-password" required></label>'''
          )

          # OpenAPI: customer and representative policies are now intentionally distinct.
          replace(
              'backend/openapi.yaml',
              '''  schemas:\n    StrongPassword:\n      type: string''',
              '''  schemas:\n    CustomerPassword:\n      type: string\n      minLength: 6\n      maxLength: 200\n      pattern: "^(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,200}$"\n      description: Customer password with at least one letter and one number; uppercase/lowercase is not required.\n      writeOnly: true\n    PasswordCandidate:\n      type: string\n      minLength: 6\n      maxLength: 200\n      description: Reset/temporary-password candidate; the server applies the account-type-specific policy after resolving the account.\n      writeOnly: true\n    StrongPassword:\n      type: string'''
          )
          replace(
              'backend/openapi.yaml',
              '        password: { $ref: "#/components/schemas/StrongPassword" }',
              '        password: { $ref: "#/components/schemas/CustomerPassword" }',
              1,
          )
          replace(
              'backend/openapi.yaml',
              '''        password: { $ref: "#/components/schemas/StrongPassword" }\n        confirmation: { $ref: "#/components/schemas/StrongPassword" }''',
              '''        password: { $ref: "#/components/schemas/PasswordCandidate" }\n        confirmation: { $ref: "#/components/schemas/PasswordCandidate" }'''
          )

          replace(
              'backend/tests/security.test.ts',
              '''  it("uses the same strong password policy for customers and representatives", () => {\n    expect(validateCustomerPasswordPolicy("short")).not.toHaveLength(0);\n    expect(validateCustomerPasswordPolicy("StrongPassword123")).toEqual([]);\n    expect(validatePasswordPolicy("short")).not.toHaveLength(0);\n    expect(validatePasswordPolicy("StrongPassword123")).toEqual([]);\n  });''',
              '''  it("keeps customer passwords simple while representative passwords remain strong", () => {\n    expect(validateCustomerPasswordPolicy("abc123")).toEqual([]);\n    expect(validateCustomerPasswordPolicy("ABC123")).toEqual([]);\n    expect(validateCustomerPasswordPolicy("abcdef")).not.toHaveLength(0);\n    expect(validateCustomerPasswordPolicy("123456")).not.toHaveLength(0);\n    expect(validateCustomerPasswordPolicy("abc!123")).not.toHaveLength(0);\n    expect(validatePasswordPolicy("short")).not.toHaveLength(0);\n    expect(validatePasswordPolicy("StrongPassword123")).toEqual([]);\n  });'''
          )

          replace(
              'backend/tests/openapi-current-contract.test.ts',
              'it("documents immediate customer signup and the unified strong password", async () => {',
              'it("documents immediate customer signup and the simple customer password policy", async () => {'
          )
          replace(
              'backend/tests/openapi-current-contract.test.ts',
              '''    expect(text).toContain("minLength: 12");\n    expect(text).not.toContain("Register a customer and queue a six-digit Email OTP");''',
              '''    expect(text).toContain("CustomerPassword:");\n    expect(text).toContain("minLength: 6");\n    expect(text).toContain("at least one letter and one number");\n    expect(text).toContain("StrongPassword:");\n    expect(text).toContain("minLength: 12");\n    expect(text).not.toContain("Register a customer and queue a six-digit Email OTP");'''
          )

          # Guard against the old customer UI constraint returning unnoticed.
          for path in ['Sign Up modern.html', 'profile.html']:
              text = Path(path).read_text(encoding='utf-8')
              if 'name="password" minlength="8"' in text:
                  raise SystemExit(f'{path}: stale customer minlength=8 remains')

          print('Customer password policy patch applied successfully.')
          PY
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Validate backend and browser JavaScript
        shell: bash
        run: |
          cd backend
          npm run lint
          npm run typecheck
          npm test
          cd ..
          find Js Eye -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/database-authoritative-storage.cjs
      - name: Commit approved changes to main
        shell: bash
        run: |
          git config user.name "Mouaz Mohammed"
          git config user.email "midomoaaz3@gmail.com"
          git add backend/src/security/password.ts backend/src/modules/identity/identity.routes.ts backend/src/modules/identity/identity.service.ts backend/openapi.yaml backend/tests/security.test.ts backend/tests/openapi-current-contract.test.ts "Sign Up modern.html" profile.html
          git commit -m "fix: simplify customer password policy [batch:8] [no-deploy]"
          git push origin HEAD:main
