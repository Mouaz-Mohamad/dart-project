# DART CODE GUIDE | .github/workflows/lighthouse-production.yml
# الغرض: قياس PageSpeed/Lighthouse للموقع الحقيقي بعد نجاح Production checks.
name: Lighthouse Production Audit

on:
  workflow_run:
    workflows: ["Production checks"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: lighthouse-production-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No system Chrome found; installing Playwright Chromium fallback."
            npm install --no-save --package-lock=false playwright@1.55.0
            npx playwright install --with-deps chromium
            CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          fi
          echo "path=$CHROME_PATH" >> "$GITHUB_OUTPUT"
          "$CHROME_PATH" --version || true

      - name: Resolve the actual storefront revision
        id: storefront-release
        env:
          REQUESTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          function storefrontChanged(files) {
            return !Array.isArray(files) || files.length >= 300 || files.some(file =>
              typeof file.filename !== 'string' || [file.filename,file.previous_filename].filter(Boolean).some(name =>
                !/^(?:backend\/|tests\/|docs\/|\.github\/|AGENTS\.md$|scripts\/vercel-ignore-frontend\.sh$)/.test(name)));
          }
          const requested = process.env.REQUESTED_RELEASE_SHA;
          let measured = requested;
          try {
            const live = await fetch('https://www.dartofficial.com/release.json', {cache:'no-store',signal:AbortSignal.timeout(15000)});
            const served = live.ok ? (await live.json()).sha : null;
            if (/^[a-f0-9]{40}$/.test(served || '') && served !== requested) {
              const compared = await fetch(`https://api.github.com/repos/Mouaz-Mohamad/dart-project/compare/${served}...${requested}`, {
                headers:{Accept:'application/vnd.github+json','User-Agent':'Dart-Lighthouse-Revision'},signal:AbortSignal.timeout(15000)});
              const comparison = compared.ok ? await compared.json() : null;
              if (comparison && ['ahead','identical'].includes(comparison.status) && !storefrontChanged(comparison.files)) measured = served;
            }
          } catch { /* Unknown equivalence requires an exact new deployment. */ }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${measured}\n`);
          fs.writeFileSync('lighthouse-release.json',JSON.stringify({requestedCommit:requested,measuredStorefrontCommit:measured}));
          NODE

      - name: Wait for the exact production commit
        env:
          DART_EXPECTED_RELEASE_SHA: ${{ steps.storefront-release.outputs.sha }}
        run: node scripts/wait-production-release.mjs

      - name: Run Mobile Lighthouse
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          npx --yes lighthouse@latest "https://www.dartofficial.com/" \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=./lighthouse-mobile.json

      - name: Run Desktop Lighthouse
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          npx --yes lighthouse@latest "https://www.dartofficial.com/" \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=./lighthouse-desktop.json

      - name: Verify production did not change during measurement
        env:
          DART_EXPECTED_RELEASE_SHA: ${{ steps.storefront-release.outputs.sha }}
        run: node scripts/wait-production-release.mjs --once

      - name: Print Dart Lighthouse summary
        run: node scripts/lighthouse-summary.mjs lighthouse-mobile.json lighthouse-desktop.json

      - name: Enforce Dart Lighthouse quality gate
        run: node scripts/lighthouse-gate.mjs lighthouse-mobile.json lighthouse-desktop.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-lighthouse-${{ github.event.workflow_run.head_sha }}
          path: |
            lighthouse-mobile.json
            lighthouse-desktop.json
            lighthouse-release.json
          retention-days: 7
