name: One-time font consolidation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/perf-step3-fonts-once.yml"

permissions:
  contents: write

jobs:
  consolidate-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Consolidate storefront fonts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/perf_step3_fonts.py
          git diff --check
          node tests/performance-budget.cjs
      - name: Commit step 3
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/perf-step3-fonts-once.yml
          rm scripts/perf_step3_fonts.py
          git config user.name "Dart Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: consolidate storefront fonts to two families"
          git push origin HEAD:main
