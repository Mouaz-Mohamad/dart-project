name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "Eye/**/*.js"
      - "Js/**/*.js"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Eye/**/*.js"
      - "Js/**/*.js"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dart
          POSTGRES_PASSWORD: dart
          POSTGRES_DB: dart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dart -d dart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://dart:dart@127.0.0.1:5432/dart_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and PostgreSQL integration tests
        run: npm test
      - name: Browser JavaScript syntax
        run: |
          find ../Eye ../Js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
