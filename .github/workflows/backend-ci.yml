name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "Eye/**/*.js"
      - "Js/**/*.js"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Eye/**/*.js"
      - "Js/**/*.js"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Browser JavaScript syntax
        run: |
          find ../Eye ../Js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
