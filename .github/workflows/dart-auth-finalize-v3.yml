name: Finalize Dart auth repair v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dart-auth-finalize-v3.yml"

permissions:
  contents: write

env:
  NODE_ENV: test
  TEST_DATABASE_URL: postgresql://dart:dart@127.0.0.1:5432/dart_test

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dart
          POSTGRES_PASSWORD: dart
          POSTGRES_DB: dart_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dart -d dart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Apply minimal verified corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding="utf-8")
          def write(path, text): Path(path).write_text(text, encoding="utf-8")
          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing target: {label}")
              return text.replace(old, new, 1)

          # Customer password policy message matches the real 6+ only rule.
          p = "backend/src/modules/identity/identity.service.ts"
          t = read(p)
          t = once(
              t,
              '"Password must be at least 6 characters and contain letters and numbers"',
              '"Password must contain at least 6 characters"',
              "customer password message",
          )
          write(p, t)

          # ESLint: use a normal type-only PoolClient import.
          p = "backend/src/modules/identity/social-auth.service.ts"
          t = read(p)
          t = once(t, 'import type { Pool } from "pg";', 'import type { Pool, PoolClient } from "pg";', "pg import")
          t = once(t, 'client: import("pg").PoolClient,', 'client: PoolClient,', "PoolClient annotation")
          write(p, t)

          # One-time social capability must be in POST JSON body, not the URL.
          p = "backend/src/modules/identity/social-auth.routes.ts"
          t = read(p)
          start = t.index('  router.get(\n    "/auth/social/challenge",')
          end = t.index('  router.post(\n    "/auth/social/complete",', start)
          route = "\n".join([
              '  router.post(',
              '    "/auth/social/challenge",',
              '    authLimiter(30),',
              '    async (request, response) => {',
              '      const body = z.object({ token: z.string().min(40).max(500) }).parse(request.body);',
              '      response.status(200).json(await service.challenge(body.token));',
              '    },',
              '  );',
              '',
              '',
          ])
          write(p, t[:start] + route + t[end:])

          p = "Js/dart-auth-social.js"
          t = read(p)
          old = "\n".join([
              '      const challenge = await api(',
              '        `/api/v1/auth/social/challenge?token=${encodeURIComponent(token)}`,',
              '      );',
          ])
          new = "\n".join([
              '      const challenge = await api("/api/v1/auth/social/challenge", {',
              '        method: "POST",',
              '        body: { token },',
              '      });',
          ])
          t = once(t, old, new, "browser challenge transport")
          write(p, t)

          # OpenAPI remains valid YAML with explicit indentation.
          p = "backend/openapi.yaml"
          t = read(p).replace("version: 0.6.1", "version: 0.6.2", 1)
          start = t.index("  /auth/social/challenge:\n")
          end = t.index("  /auth/social/complete:\n", start)
          block = "\n".join([
              '  /auth/social/challenge:',
              '    post:',
              '      tags: [Customer Auth]',
              '      summary: Read safe profile hints without putting the one-time social capability in request URLs',
              '      operationId: getCustomerSocialChallenge',
              '      requestBody:',
              '        required: true',
              '        content:',
              '          application/json:',
              '            schema:',
              '              type: object',
              '              additionalProperties: false',
              '              required: [token]',
              '              properties:',
              '                token: { type: string, minLength: 40, maxLength: 500 }',
              '      responses:',
              '        "200": { description: Provider, verified email, new/existing account state and required completion fields }',
              '        "400": { $ref: "#/components/responses/ValidationError" }',
              '',
          ])
          write(p, t[:start] + block + t[end:])

          p = "docs/API_CONTRACT.md"
          t = read(p)
          needle = "3. Dart ينشئ one-time completion capability قصيرة العمر؛ المخزن في PostgreSQL هو الـhash فقط، والـcapability نفسها ترجع للمتصفح داخل URL fragment وليس query string."
          replacement = needle + " بعد إزالة الـfragment من العنوان، الواجهة تقرأ بيانات الـchallenge عبر `POST /api/v1/auth/social/challenge` وتضع الـcapability في JSON body حتى لا تظهر في request URL/logs."
          t = once(t, needle, replacement, "social capability docs")
          write(p, t)

          # Script tags are attached but never visually visible.
          p = "tests/full-site-browser.js"
          t = read(p)
          t = once(
              t,
              'await account.waitForSelector(\'script[data-dart-social-auth="1"]\');',
              'await account.waitForSelector(\'script[data-dart-social-auth="1"]\', { state: "attached" });',
              "Chromium selector",
          )
          write(p, t)
          PY

      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Backend verification
        working-directory: backend
        run: |
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run typecheck
          npm test
      - name: Frontend static verification
        run: |
          find Eye Js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          node tests/database-authoritative-storage.cjs
          node tests/auth-contract.js
          node tests/security-boundaries.cjs
          node tests/performance-budget.cjs
          node tests/catalog-category-contract.js
          node tests/dart-finance-unit.js
          node tests/finance-dashboard-contract.js
          node tests/server-authority-contract.js
      - name: Chromium setup
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Chromium smoke
        run: node tests/full-site-browser.js
      - name: Commit verified correction and clean temporary workflows
        run: |
          set -euo pipefail
          git config user.name "Mouaz Mohammed"
          git config user.email "midomoaaz3@gmail.com"
          git rm .github/workflows/dart-auth-finalize.yml \
                 .github/workflows/dart-auth-finalize-v2.yml \
                 .github/workflows/dart-auth-finalize-v3.yml
          git add backend/src/modules/identity/identity.service.ts \
                  backend/src/modules/identity/social-auth.service.ts \
                  backend/src/modules/identity/social-auth.routes.ts \
                  backend/openapi.yaml docs/API_CONTRACT.md \
                  Js/dart-auth-social.js tests/full-site-browser.js
          git commit -m "fix: finalize customer social auth contracts [batch:7] [no-deploy]"
          git push origin HEAD:main
