# DART CODE GUIDE | .github/workflows/batch-policy.yml
# الغرض: ضبط سياسة دفعات النشر لمنع تغييرات Production العشوائية.
name: Production batch policy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-batch-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require numbered batch marker
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          grep -Eq '\[batch:[0-9]+\]' <<<"$COMMIT_MESSAGE" || { echo 'Missing numbered [batch:N] marker'; exit 1; }
          if grep -Fq '[deploy]' <<<"$COMMIT_MESSAGE"; then
            echo 'Production deployment requested for this batch.'
          else
            echo 'CI-only batch: Vercel ignore rules will skip production deployment.'
          fi
      - name: Validate Vercel deployment config
        run: node backend/scripts/check-vercel-config.mjs
      - name: Database-authoritative browser storage check
        run: node tests/database-authoritative-storage.cjs
      - name: Check browser JavaScript syntax
        run: |
          find Js Eye -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Run backend static checks, production build and tests
        working-directory: backend
        run: npm run lint && npm run typecheck && npm run build && npm test
