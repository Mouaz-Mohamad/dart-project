# DART CODE GUIDE | .github/workflows/batch-policy.yml
# الغرض: تشغيل اختبارات Production على main بدون اشتراط رقم Batch لعملية النشر.
name: Production checks

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Vercel deployment config
        run: node backend/scripts/check-vercel-config.mjs
      - name: Database-authoritative browser storage and SEO checks
        run: |
          node tests/database-authoritative-storage.cjs
          node tests/cache-revalidation-contract.cjs
          node tests/seo_checks.js
          node tests/product_deep_links.cjs
          node tests/product_ssr_seo.cjs
      - name: Check browser JavaScript syntax
        run: |
          find Js Eye -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Run backend static checks, production build and tests
        working-directory: backend
        run: npm run lint && npm run typecheck && npm run build && npm test
