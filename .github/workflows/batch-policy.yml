name: Production batch policy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-batch-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require numbered deploy batch markers
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          grep -Eq '\[batch:[0-9]+\]' <<<"$COMMIT_MESSAGE" || { echo 'Missing numbered [batch:N] marker'; exit 1; }
          grep -Fq '[deploy]' <<<"$COMMIT_MESSAGE" || { echo 'Missing [deploy] marker'; exit 1; }
      - name: Validate Vercel deployment config
        run: node backend/scripts/check-vercel-config.mjs
      - name: Database-authoritative browser storage check
        run: node tests/database-authoritative-storage.cjs
      - name: Check browser JavaScript syntax
        run: |
          find Js Eye -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend static checks and tests
        working-directory: backend
        run: npm run lint && npm run typecheck && npm test
