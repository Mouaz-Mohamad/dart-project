name: One-time image performance optimization

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/perf-step1-images-once.yml"

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Optimize raster assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python scripts/perf_step1_images.py
          git diff --check
          node tests/performance-budget.cjs

      - name: Commit step 1
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/perf-step1-images-once.yml
          rm scripts/perf_step1_images.py
          git config user.name "Dart Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: convert raster assets to WebP with fallbacks"
          git push origin HEAD:main
