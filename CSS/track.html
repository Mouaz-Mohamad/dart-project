<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تتبع طلبك | Dart</title>
  <meta name="robots" content="noindex,nofollow">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="CSS/Stayle 1.css">
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/fixes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class='dja-flexdir'>
    <div class="mother">
      <header id="header-container" aria-label="Main Navigation"></header>

      <main>
<div class="tracking-card">
  <!-- Map Container -->
  <div id="trackingMapShell" class="tracking-map-shell is-disabled">
    <div id="tracking-map" aria-label="Live delivery map"></div>
    <div id="trackingMapDisabled" class="tracking-map-disabled">Representative not assigned yet</div>
  </div>
  <div id="trackingMapSummary" class="tracking-map-summary" role="status">Delivery location has not been activated.</div>
  <div class="content">
    
    <!-- Order Header -->
    <div class="order-header">
      <div>
        <div class="order-id">Order ID</div>
        <div style="font-size: 11px; color: #64748b;">Date</div>
      </div>
      <div id="etaTime" class="eta-badge">ETA: 15 mins</div>
    </div>

    <!-- 5 Steps Timeline -->
    <div class="stepper">
      <div class="stepper-progress" style="width: 75%;"></div>

      <div class="step active">
        <div class="circle">✓</div>
        <span class="step-text">Confirmed</span>
      </div>
      <div class="step active">
        <div class="circle">✓</div>
        <span class="step-text">Preparing</span>
      </div>
      <div class="step active">
        <div class="circle">✓</div>
        <span class="step-text">Picked Up</span>
      </div>
      <div class="step active">
        <div class="circle">4</div>
        <span class="step-text">On the Way</span>
      </div>
      <div class="step">
        <div class="circle">5</div>
        <span class="step-text">Delivered</span>
      </div>
    </div>

    <!-- Order Items Summary -->
    <div class="items-box">
      <div class="items-title">Order Items:</div>
      <div class="item-row">
        <span>Loading order items…</span>
        <strong>—</strong>
      </div>
      <hr style="border-color: #e2e8f0; margin: 8px 0;">
      <div class="item-row" style="font-weight: bold; color: #0f172a;">
        <span>Total:</span>
        <span>—</span>
      </div>
    </div>

    <!-- Driver Info -->
    <div class="driver-box">
      <div>
        <div style="font-weight:bold; font-size: 14px; color: #0f172a;">Representative not assigned</div>
        <div style="font-size:11px; color:#64748b;">Waiting for assignment</div>
      </div>
      <a href="tel:01000000000" class="btn-call">Call</a>
    </div>

  </div>
</div>
      </main>

      <footer id="footer" aria-label="footer."></footer>

    </div>
<!-- Leaflet JS -->
  <!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="Js/one .js"></script>
<script src="Js/dart-platform.js"></script>
<script src="Js/dart-tracking.js"></script>

</body>
</html>
