<section class="feedback-section dja-flexdir" aria-label="Exchange or Return Request | طلب استبدال أو إرجاع">
    <h1 class="section-title">&nbsp;Exchange <br>&nbsp;&nbsp;&nbsp;&nbsp;or Return Request</h1>

    <form id="returnRequestForm" class="form">
        <div class="form-group">
            <label for="full-name">Full Name</label>
            <input type="text" id="return-full-name" name="full_name" placeholder="you + Father + GrandPa" minlength="3" autocomplete="name" required>
        </div>

        <div class="form-row flex-center">
            <div class="form-group">
                <label for="return-phone-1">Phone Number</label>
                <input type="tel" id="return-phone-1" name="phone1" placeholder="01*********" pattern="01[0125][0-9]{8}" inputmode="tel" required>
            </div>
            <div class="form-group">
                <label for="return-phone-2">Phone Number 2</label>
                <input type="tel" id="return-phone-2" name="phone2" placeholder="01*********" pattern="01[0125][0-9]{8}" inputmode="tel">
            </div>
        </div>


        <div class="form-group">
            <label for="return-email">Email</label>
            <input type="email" id="return-email" name="email" placeholder="Value" autocomplete="email" required>
        </div>

        <div class="form-row flex-center">
            <div class="form-group">
                <label for="return-item-code">Item Code</label>
                <input type="text" id="return-item-code" name="item_code" placeholder="Value" required>
            </div>
            <div class="form-group">
                <label for="return-model-code">Model code</label>
                <input type="text" id="return-model-code" name="model_code" placeholder="Value" required>
            </div>
        </div>
        <div class="form-row flex-center">
            <div class="container-select">
                <h4>Request Type</h4>
                <select name="request_type" required>
                <option value="" selected disabled hidden> Select </option>
                <option> Exchange | استبدال</option>
                <option> Refund | استرجاع</option>
            </select>
            </div>
            <div class="container-select">
                <h4>Reason for request</h4>
                <select name="reason" required>
                    <option value="" selected disabled hidden> Select </option>
                    <option value="wrong_size">المقاس غير مناسب</option>
                    <option value="defective">المنتج به عيب تصنيع أو تلف</option>
                    <option value="not_as_described">المنتج يختلف عن الصورة أو الوصف</option>
                    <option value="wrong_item">استلمت منتجًا مختلفًا عن طلبي</option>
                    
                    <!-- خيارات جودة أو تفضيل -->
                    <option value="quality_issue">خامة المنتج لم تعجبني</option>
                    <option value="changed_mind">لم أعد بحاجة إلى المنتج (تغيير رأي)</option>
                    <option value="missing_parts">يوجد نقص في محتويات الشحنة</option>
                    
                    <!-- خيار عام -->
                    <option value="other">سبب آخر</option>
            </select>
            </div>
        </div>

        <div class="form-group">
            <label for="return-notes">Notes</label>
            <textarea id="return-notes" name="notes" placeholder="Value" rows="4"></textarea>
        </div>


        <button type="submit" class="submit-btn-form">Submit</button>
    </form>
</section>
