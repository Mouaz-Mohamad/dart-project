<section class="feedback-section dja-flexdir" aria-label="Contact Us | اتصل بنا">
    <h1 class="section-title">&nbsp;Contact Us</h1>

    <form id="contactForm" class="form">
        <div class="form-group">
            <label for="full-name">Full Name</label>
            <input type="text" id="contact-full-name" name="full_name" placeholder="you + Father + GrandPa" minlength="3" autocomplete="name" required>
        </div>

        <div class="form-row flex-center">
            <div class="form-group">
                <label for="contact-phone-1">Phone Number</label>
                <input type="tel" id="contact-phone-1" name="phone1" placeholder="01*********" pattern="01[0125][0-9]{8}" inputmode="tel" required>
            </div>
            <div class="form-group">
                <label for="contact-phone-2">Phone Number 2</label>
                <input type="tel" id="contact-phone-2" name="phone2" placeholder="01*********" pattern="01[0125][0-9]{8}" inputmode="tel">
            </div>
        </div>

        <div class="form-group">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="email" placeholder="Value" autocomplete="email" required>
        </div>

        <div class="form-group">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" placeholder="Value" rows="4" required></textarea>
        </div>

        <button type="submit" class="submit-btn-form">Submit</button>
    </form>
</section>
