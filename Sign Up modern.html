<!-<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login \ Sign Up Modern</title>
    <meta name="description" content="Login to CXI - The hub for artificial intelligence and programming insights.">
    <meta name="keywords" content="CXI, login, AI, programming, technology">
    <meta name="author" content="CXI Team">
    <link rel="icon" href="img/logo-cxi.png" type="image/png">
    <meta property="og:title" content="CXI Login Page">
    <meta property="og:description" content="Login to CXI - Your gateway to AI and programming insights.">
    <meta property="og:image" content="img/logo-cxi.png">
    <meta property="og:url" content="https://www.cxi.com/login">
    <meta name="twitter:card" content="summary_large_image">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: 0;
            font-family: 'Poppins', sans-serif;
        }

        body{
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(90deg, #e2e2e2, #c9d6ff);
        }

        .container{
            position: relative;
            width: 850px;
            height: 550px;
            background: #fff;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            border-radius: 30px;
            overflow: hidden;
        }
        .form-box{
            position: absolute;
            right: 0;
            width: 50%;
            height: 100%;
            background: #fff;
            display: flex;
            align-items: center;
            color: #000076;
            text-align: center;
            z-index: 1;
            transition: .4s ease-in-out .3s, visibility 0s -1s;
        }
        .container.active .form-box{
            right: 50%;
        }
        .form-box form{
            width: 100%;
        }
        .container h1{
            font-size: 35px;
            margin: -10px 0;
        }
        .input-box{
            position: relative;
            margin: 30px 0;
        }
        .input-box input{
            width: 70%;
            padding: 13px 50px 13px 20px;
            background: #eee;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }
        .input-box input::placeholder{
            color: #333;
            font-weight: 500;
        }
        .input-box i{
            position: absolute;
            right: 10%;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #333;
        }
        .forgot-link{
            margin: -15px 0 15px;
        }
        .forgot-link a{
            font-size: 15px;
            text-decoration: none;
            color: #333;
        }
        .btn{
            width: 80%;
            height: 45px;
            background-color: #000076;
            border-radius: 8px;
            box-shadow: 0 0 10px #000076;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #fff;
            font-size: 20px;
        }
        .container p{
            font-size: 16px;
            margin: 15px 0;
        }
        .social-icons{
            display: flex;
            justify-content: center;
        }
        .social-icons a{
            display: inline-flex;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 24px;
            color: #333;
            text-decoration: none;
            margin: 0 8px;
        }


        .form-box.register{
            visibility: hidden;
        }
        .container.active .form-box.register{
            visibility: visible;
        }
        .toggle-box{
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .toggle-box::before{
            content: '';
            position: absolute;
            left: -250%;
            width: 300%;
            height: 100%;
            background: #d2a503;
            border-radius: 150px;
            z-index: 2;
            transition: 0.7s ease-in-out;
        }
        .container.active .toggle-box::before{
            left: 50%;
        }
        .toggle-panel{
            position: absolute;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            color: #fff;
            transition: .3s ease-in-out;
        }
        .toggle-panel.toggle-left{
            left: 0;
            transition-delay: .2s;
        }
        .container.active .toggle-panel.toggle-left{
            left: -50%;
            transition-delay: .4s;
        }
        .toggle-panel.toggle-right{
            right: -50%;
            transition-delay: .2s;
        }
        .container.active .toggle-panel.toggle-right{
            right: 0;
            transition-delay: .4s;
        }
        .toggle-panel p{
            margin-bottom: 20px;
            font-size: 16px;
        }
        .toggle-panel .btn{
            width: 160px;
            height: 50px;
            background-color: transparent;
            border: 2px solid #eee;
            box-shadow: none;
        }



        @media screen and (max-width: 650px){
            .container{
                height: 100vh;
            }

            .form-box{
                width: 100%;
                height: 70%;
                bottom: 0;
            }
            .container.active .form-box{
                right: 0;
                bottom: 30%;
            }

            .toggle-box::before{
                width: 100%;
                height: 300%;
                left: 0;
                top: -270%;
                border-radius: 20vw;
            }
            .container.active .toggle-box::before{
                top: 70%;
                left: 0;
            }

            .toggle-panel{
                width: 100%;
                height: 30%;
            }

            .toggle-panel.toggle-left{
                top: 0;
            }
            .container.active .toggle-panel.toggle-left{
                left: 0;
                top: -30%;
            }

            .toggle-panel.toggle-right{
                right: 0;
                bottom: -30%;
            }
            .container.active .toggle-panel.toggle-right{
                bottom: 0;
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="form-box login">
            <form action="">
                <h1>login</h1>
                <div class="input-box">
                    <input type="text" placeholder="Username" required>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box">
                    <input type="password" placeholder="password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>

                <div class="forgot-link">
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn">login</button>
                <p>or login with social platforms</p>
                <div class="social-icons">
                    <a href="#"><i class='bx bxl-google' ></i></a>
                    <a href="#"><i class='bx bxl-facebook' ></i></a>
                    <a href="#"><i class='bx bxl-github' ></i></a>
                    <a href="#"><i class='bx bxl-linkedin' ></i></a>
                </div>
            </form>
        </div>

        <div class="form-box register">
            <form action="">
                <h1>Registration</h1>
                <div class="input-box">
                    <input type="text" placeholder="Username" required>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box">
                    <input type="email" placeholder="Email" required>
                    <i class='bx bxs-envelope'></i>
                </div>

                <div class="input-box">
                    <input type="password" placeholder="password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>

                <button type="submit" class="btn">Registration</button>
                <p>or Registration with social platforms</p>
                <div class="social-icons">
                    <a href="#"><i class='bx bxl-google' ></i></a>
                    <a href="#"><i class='bx bxl-facebook' ></i></a>
                    <a href="#"><i class='bx bxl-github' ></i></a>
                    <a href="#"><i class='bx bxl-linkedin' ></i></a>
                </div>
            </form>
        </div>


        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hello, Welcome!</h1>
                <p>Don't have an account?</p>
                <button class="btn register-btn">Register</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>Welcome Back</h1>
                <p>Already have an account?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>
    </div>



    <script>
        const container = document.querySelector('.container');
        const registerBtn = document.querySelector('.register-btn');
        const loginBtn = document.querySelector('.login-btn');

        registerBtn.addEventListener('click', () => {
            container.classList.add('active');
        });

        loginBtn.addEventListener('click', () => {
            container.classList.remove('active');
        });
    </script>
</body>
</html>
