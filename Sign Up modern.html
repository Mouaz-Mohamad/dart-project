<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول أو إنشاء حساب | Dart</title>
    <meta name="description" content="سجّل الدخول إلى حساب Dart أو أنشئ حسابًا جديدًا لمتابعة الطلبات والمرتجعات.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="CSS/Stayle 1.css">
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/fixes.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, #e2e2e2, #c9d6ff);
        }

        /* الكارت في الشاشات الكبيرة */
        .container {
            position: relative;
            width: 100%;
            max-width: 750px;
            height: 480px;
            background: var(--white);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            overflow: hidden;
        }

        .form-box {
            position: absolute;
            right: 0;
            width: 50%;
            height: 100%;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bragnte);
            text-align: center;
            z-index: 1;
            transition: .4s ease-in-out .3s, visibility 0s -1s;
            padding: 0px;
        }

        .container.active .form-box {
            right: 50%;
        }

        .form-box form {
            width: 100%;
        }

        .container h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .input-box {
            position: relative;
            margin: 12px 0;
        }

        .input-box input {
            width: 85%;
            padding: 10px 40px 10px 15px;
            background: #eee;
            border-radius: 6px;
            border: none;
            outline: none;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-box input::placeholder {
            color: #666;
        }

        .input-box i {
            position: absolute;
            right: 12%;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: var(--text-muted);
        }

        .forgot-link {
            margin: -5px 0 10px;
        }

        .forgot-link a {
            font-size: 13px;
            text-decoration: none;
            color: #333;
        }

        .btn {
            width: 85%;
            height: 30px;
            background-color: var(--bragnte);
            border-radius: 6px;
            box-shadow: 0 0 6px rgba(0, 0, 118, 0.4);
            border: none;
            cursor: pointer;
            font-weight: 500;
            color: #fff;
            font-size: 12px;
        }

        .container p {
            font-size: 12px;
            margin: 8px 0;
        }

        .social-icons {
            display: flex;
            justify-content: center;
        }

        .social-icons a {
            display: inline-flex;
            padding: 6px;
            border: 1px solid #eee;
            border-radius: 6px;
            font-size: 30px;
            color: var(--bragnte);
            text-decoration: none;
            margin: 0 4px;
        }

        .form-box.register {
            visibility: hidden;
        }

        .container.active .form-box.register {
            visibility: visible;
        }

        .toggle-box {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .toggle-box::before {
            content: '';
            position: absolute;
            left: -250%;
            width: 300%;
            height: 100%;
            background: var(--bragnte);
            color: var(--white);
            border-radius: 100px;
            z-index: 2;
            transition: 0.7s ease-in-out;
        }

        .container.active .toggle-box::before {
            left: 50%;
        }

        .toggle-panel {
            position: absolute;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            color: #fff;
            transition: .3s ease-in-out;
            padding: 0px;
        }

        .toggle-panel.toggle-left {
            left: 0;
            transition-delay: .2s;
        }

        .container.active .toggle-panel.toggle-left {
            left: -50%;
            transition-delay: .4s;
        }

        .toggle-panel.toggle-right {
            right: -50%;
            transition-delay: .2s;
        }

        .container.active .toggle-panel.toggle-right {
            right: 0;
            transition-delay: .4s;
        }

        .toggle-panel p {
            margin-bottom: 12px;
            font-size: 13px;
        }

        .toggle-panel .btn {
            width: 120px;
            height: 30px;
            background-color: transparent;
            border: 2px solid #eee;
            box-shadow: none;
        }

        /* الشاشات الصغيرة: ملء الشاشة بالكامل */
        @media screen and (max-width: 650px) {
            .container {
                width: 100%;
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }

            .form-box {
                width: 100%;
                height: 70%;
                bottom: 0;
            }

            .container.active .form-box {
                right: 0;
                bottom: 30%;
            }

            .toggle-box::before {
                width: 100%;
                height: 300%;
                left: 0;
                top: -270%;
                border-radius: 20vw;
            }

            .container.active .toggle-box::before {
                top: 70%;
                left: 0;
            }

            .toggle-panel {
                width: 100%;
                height: 30%;
            }

            .toggle-panel.toggle-left {
                top: 0;
            }

            .container.active .toggle-panel.toggle-left {
                left: 0;
                top: -30%;
            }

            .toggle-panel.toggle-right {
                right: 0;
                bottom: -30%;
            }

            .container.active .toggle-panel.toggle-right {
                bottom: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Form -->
        <div class="form-box login">
            <form id="loginForm" action="#" novalidate>
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" name="identifier" placeholder="Email or phone" autocomplete="username" required>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box">
                    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>

                <div class="forgot-link">
                    <a href="#" data-forgot-password>Forgot password?</a>
                </div>

                <button type="submit" class="btn enter-btn">Login</button>
                <p>Or login with social platforms</p>
                <div class="social-icons">
                    <a href="#" data-social-login="google" aria-label="Login with Google"><i class='bx bxl-google'></i></a>
                    <a href="#" data-social-login="facebook" aria-label="Login with Facebook"><i class='bx bxl-facebook'></i></a>
                </div>
            </form>
        </div>

        <!-- Registration Form -->
        <div class="form-box register">
            <form id="registerForm" action="#" novalidate>
                <h1>Registration</h1>
                <div class="input-box">
                    <input type="text" name="name" placeholder="Full name" autocomplete="name" minlength="3" required>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box">
                    <input type="email" name="email" placeholder="Email" autocomplete="email" required>
                    <i class='bx bxs-envelope'></i>
                </div>

                <div class="input-box">
                    <input type="tel" name="phone1" placeholder="Phone number" autocomplete="tel" inputmode="tel" required>
                    <i class='bx bxs-phone'></i>
                </div>

                <div class="input-box">
                    <input type="tel" name="phone2" placeholder="Phone number 2 (optional)" inputmode="tel">
                    <i class='bx bxs-phone'></i>
                </div>

                <div class="input-box">
                    <input type="password" name="password" placeholder="Password (8+ characters)" autocomplete="new-password" minlength="8" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>

                <div class="input-box">
                    <input type="date" name="birthday" aria-label="Your birthday" autocomplete="bday" required>
                    <i class="fa-solid fa-calendar"></i>
                </div>

                <button type="submit" class="btn enter-btn">Register</button>
                <p>Or register with social platforms</p>
                <div class="social-icons">
                    <a href="#" data-social-login="google" aria-label="Register with Google"><i class='bx bxl-google'></i></a>
                    <a href="#" data-social-login="facebook" aria-label="Register with Facebook"><i class='bx bxl-facebook'></i></a>
                </div>
            </form>
        </div>

        <!-- Toggle Panel -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hello, Welcome!</h1>
                <p>Don't have an account?</p>
                <button type="button" class="btn register-btn">Register</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>Welcome Back!</h1>
                <p>Already have an account?</p>
                <button type="button" class="btn login-btn" id="enter-btn">Login</button>
            </div>
        </div>
    </div>

    <script>
        const container = document.querySelector('.container');
        const registerBtn = document.querySelector('.register-btn');
        const loginBtn = document.querySelector('.login-btn');

        registerBtn.addEventListener('click', () => {
            container.classList.add('active');
        });

        loginBtn.addEventListener('click', () => {
            container.classList.remove('active');
        });
    </script>
    <script src="Js/one .js"></script>
    <script src="Js/dart-platform.js"></script>
</body>
</html>
