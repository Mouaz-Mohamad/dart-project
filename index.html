<body class='dja-flexdir'>
    <div class="mother">
        <header id="header-container" aria-label="Main Navigation"></header>
            
            <main class="#">
                <h1 class="sr-only">Dart for you (دارت) - لبس رجالي وشبابي في مصر</h1>

                <!-- Hero section -->
                <section class="hero" aria-label="Dart featured collection">
                    <img id="dart-hero-image" data-dart-hero data-dart-media-ready="true" src="/Photos/hero 1.webp" alt="Dart for you ملابس رجالي وشبابي" width="941" height="1672" loading="eager" decoding="async" fetchpriority="high">
                    <h1 class="dart-hero-title">
                        <span id="dartTyping"></span><span class="dart-cursor" aria-hidden="true">|</span>
                    </h1>
                    <button id="btnToProducts" data-go-products type="button" class="btn-go-product">Shop Now</button>
                </section>

                <!-- سيكشن أفضل المنتجات -->
                <section class="best-products-section">
                    <h2 class="section-title-">&nbsp;Best Products</h2>
                    <div class="x-scroll-container" id="bestProductsContainer"></div>
                </section>

                <section id="leaderboard-card" aria-label="Dart Gift Card Leaderboard"></section>

                <!-- ================= سكشن المنتجات ================= -->
                <section class="products-section">
                    <h2 class="section-title-">&nbsp;Newest products</h2>
                    <div class="products-grid" id="productsContainer">
                        <div class="product-card" id="productTemplate" style="display: none;">
                            <img src="" alt="Product photograph; description is filled from the product name" class="product-img" loading="lazy" decoding="async">
                            <div class="product-details">
                            <div class="product-category"></div>
                            <div class="product-code" dir="rtl"></div>
                            <div class="product-title"></div>
                            <div class="product-footer djasb">
                                <div class="product-pricing" data-product-pricing>
                                    <span class="product-old-price" data-product-price="old" hidden></span>
                                    <span class="product-price" data-product-price="current"></span>
                                    <span class="product-discount-badge" data-product-price="discount" hidden></span>
                                </div>
                                <button type="button" class="cart-btn dja">Buy</button>
                            </div>
                            </div>
                        </div>
                    </div>
                    <button id="btnToAllProducts" data-go-products type="button" class="btn-go-product">Shop Now</button>
                </section>


                <!-- BEGIN Product-card dialogs: the Product fragment and Set dialog belong to the listing above. -->
                <div id="product-modal-host" data-section-src="sections/product-modal.html"></div>

                <section id="dartSetModal" class="dart-set-modal" role="dialog" aria-modal="true" aria-labelledby="dartSetModalTitle" hidden>
                    <div class="dart-set-dialog">
                        <button type="button" class="dart-set-close" data-set-close aria-label="Close Set details">&times;</button>
                        <div class="dart-set-gallery">
                            <img data-set-cover src="" alt="Set product gallery cover">
                            <div data-set-thumbs class="dart-set-thumbs"></div>
                        </div>
                        <article class="dart-set-details">
                            <span class="dart-set-category">Sets</span>
                            <small data-set-code></small>
                            <h2 id="dartSetModalTitle" data-set-title></h2>
                            <div data-set-components class="dart-set-components"></div>
                            <p data-set-description></p>
                            <div class="dart-set-pricing">
                                <span data-set-old-price></span>
                                <strong data-set-price>Price :</strong> EGP <em data-set-discount></em>
                            </div>
                            <p class="dart-set-status" data-set-status role="status" aria-live="polite"></p>
                            <button type="button" class="buy-now-btn" data-set-add>Add Set to Cart</button>
                        </article>
                    </div>
                </section>
                <!-- END Product-card dialogs. -->
                
                <div class="margen2020"></div>
                <section id="birthday"></section>
                <div class="margen2020"></div>

                <!-- ================= سكشن التقييمات ================= -->
                <section class="reviews-section">
                    <h2 class="section-title-">&nbsp; Our Reviews </h2>
                    <div class="reviews-container" id="reviewsContainer">
                        <div class="review-card" id="reviewTemplate" style="display: none;" dir="rtl">
                            <div>
                                <div class="stars" aria-label="Review rating"></div>
                                <div class="review-title"></div>
                                <div class="review-text"></div>
                            </div>
                            <div class="user-info" dir="rtl">
                                <span class="user-avatar dart-review-avatar" aria-hidden="true"></span>
                                <div>
                                    <div class="user-name-"></div>
                                    <div class="review-date"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <div class="margen2020"></div>

                <section id="why" aria-label="Why Choose DART?"></section>
                <div class="margen2020"></div>
                <section id="feedback-form" aria-label="Share Your Experience"></section>

            </main>
            <div class="margen2020"></div>
            <footer id="footer" aria-label="Footer"></footer>
