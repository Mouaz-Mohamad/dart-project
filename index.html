    <!-- Page-scoped critical performance/a11y rules. Keep the global 3-file CSS architecture unchanged. -->
    <style id="dart-home-critical-performance">
        .fa-solid,.fa-regular{display:inline-block;min-width:1em;min-height:1em}
        .dart-modal-close{width:100%;height:28px;padding:0;border:0;background:transparent;color:var(--bg-dark);font-size:28px;line-height:1;text-align:right;cursor:pointer}
        .dart-modal-close:hover,.dart-modal-close:focus-visible{background:transparent;color:var(--bragnte)}
        .dart-modal-close::before{display:none!important}
        .icon-menu:focus-visible,.dart-modal-close:focus-visible,.carousel-arrow:focus-visible,.btn-go-product:focus-visible,.cart-btn:focus-visible{outline:3px solid #111;outline-offset:3px}
        #birthday,.reviews-section,#why,#feedback-form,footer{content-visibility:auto;contain-intrinsic-size:auto 600px}
        @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.dart-cursor{animation:none!important}.product-card,.side-menu,.menu-facke{transition:none!important}}
    </style>

<body class='dja-flexdir'>
    <div class="mother">
        <header id="header-container" aria-label="Main Navigation"></header>
            
            <main class="#">
                <h1 class="sr-only">Dart for you (دارت) - لبس رجالي وشبابي في مصر</h1>

                <!-- Hero section -->
                <section class="hero" aria-label="Dart featured collection">
                    <img id="dart-hero-image" data-dart-hero data-dart-media-ready="true" src="/Photos/hero 1.webp" alt="Dart for you ملابس رجالي وشبابي" width="941" height="1672" loading="eager" decoding="async" fetchpriority="high">
                    <h1 class="dart-hero-title">
                        <span id="dartTyping"></span><span class="dart-cursor" aria-hidden="true">|</span>
                    </h1>
                    <button id="btnToProducts" data-go-products type="button" class="btn-go-product">Shop Now</button>
                </section>

                <!-- سيكشن أفضل المنتجات -->
                <section class="best-products-section">
                    <h2 class="section-title-">&nbsp;Best Products</h2>
                    <div class="x-scroll-container" id="bestProductsContainer"></div>
                </section>

                <section id="leaderboard-card" aria-label="Dart Gift Card Leaderboard"></section>

                <!-- ================= سكشن المنتجات ================= -->
                <section class="products-section">
                    <h2 class="section-title-">&nbsp;Newest products</h2>
                    <div class="products-grid" id="productsContainer">
                        <div class="product-card" id="productTemplate" style="display: none;">
                            <img src="" alt="Product photograph; description is filled from the product name" class="product-img" loading="lazy" decoding="async">
                            <div class="product-details">
                            <div class="product-category"></div>
                            <div class="product-code" dir="rtl"></div>
                            <div class="product-title"></div>
                            <div class="product-footer djasb">
                                <div class="product-pricing" data-product-pricing>
                                    <span class="product-old-price" data-product-price="old" hidden></span>
                                    <span class="product-price" data-product-price="current"></span>
                                    <span class="product-discount-badge" data-product-price="discount" hidden></span>
                                </div>
                                <button type="button" class="cart-btn dja">Buy</button>
                            </div>
                            </div>
                        </div>
                    </div>
                    <button id="btnToAllProducts" data-go-products type="button" class="btn-go-product">Shop Now</button>
                </section>
                <div class="margen2020"></div>
                <section id="birthday"></section>
                <div class="margen2020"></div>

                <!-- ================= سكشن التقييمات ================= -->
                <section class="reviews-section">
                    <h2 class="section-title-">&nbsp; Our Reviews </h2>
                    <div class="reviews-container" id="reviewsContainer">
                        <div class="review-card" id="reviewTemplate" style="display: none;" dir="rtl">
                            <div>
                                <div class="stars" aria-label="Review rating"></div>
                                <div class="review-title"></div>
                                <div class="review-text"></div>
                            </div>
                            <div class="user-info" dir="rtl">
                                <span class="user-avatar dart-review-avatar" aria-hidden="true"></span>
                                <div>
                                    <div class="user-name-"></div>
                                    <div class="review-date"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <div class="margen2020"></div>

                <section id="why" aria-label="Why Choose DART?"></section>
                <div class="margen2020"></div>
                <section id="feedback-form" aria-label="Share Your Experience"></section>

                <section class="model" id="SectionModel" role="dialog" aria-modal="true" aria-labelledby="dartProductModalTitle" aria-hidden="true">
                    <button type="button" class="dart-modal-close fa-x" aria-label="Close product details">&times;</button>
                    <div class="model-carousel" id="modelCarousel">
                        <div class="carousel-track" id="carouselTrack"></div>
                        <button type="button" class="carousel-arrow carousel-prev" id="carouselPrev" aria-label="Previous image">
                            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="carousel-arrow carousel-next" id="carouselNext" aria-label="Next image">
                            <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                        </button>
                        <div class="carousel-dots" id="carouselDots"></div>
                    </div>

                    <article class="model-product">
                        <div class="model-product-category"></div>
                        <div class="model-product-code"></div>
                        <div class="model-product-title" id="dartProductModalTitle"></div>
                        <div class="model-product-price">Price: &nbsp;<span class="price-number"></span>&nbsp; EGP</div>
                        <div class="sizes-container">
                            <button type="button" class="size-btn" data-size=""></button>
                        </div>
                        <div class="colors-container">
                            <button type="button" class="color-btn" data-color=""></button>
                        </div>

                        <div class="product-size-chart-actions">
                            <button type="button" id="productSizeChartBtn" class="product-size-chart-trigger" aria-controls="productSizeChartPanel" aria-expanded="false">
                                <i class="fa-solid fa-ruler-combined" aria-hidden="true"></i> Size Chart
                            </button>
                        </div>
                        <p id="productOptionStatus" class="product-option-status" role="status" aria-live="polite"></p>

                        <div id="productSizeChartPanel" class="product-size-chart-panel" hidden>
                            <div class="product-size-chart-dialog" role="dialog" aria-modal="true" aria-labelledby="productSizeChartTitle">
                                <button type="button" id="closeProductSizeChart" class="product-size-chart-close" aria-label="Close size chart">&times;</button>
                                <h3 id="productSizeChartTitle">Size Chart</h3>
                                <div id="productSizeChartContent"></div>
                            </div>
                        </div>

                        <div class="modal-qty-row djasb">
                            <span class="modal-qty-label">Quantity</span>
                            <div class="qty-control" id="modalQtyControl">
                                <button type="button" class="qty-btn" id="modalQtyDecrease" aria-label="Decrease quantity">-</button>
                                <span class="qty-value" id="modalQtyValue">1</span>
                                <button type="button" class="qty-btn" id="modalQtyIncrease" aria-label="Increase quantity">+</button>
                            </div>
                        </div>

                        <h6 class="model-all-detelis" dir="rtl"></h6>
                        <button type="button" id="modalBuyBtn" class="buy-now-btn">Buy</button>
                    </article>
                </section>
            </main>
            <div class="margen2020"></div>
            <footer id="footer" aria-label="Footer"></footer>
    </div>
    <script src="Js/dart-state.js" defer></script>

    <script src="Js/dart-catalog.js" defer></script>

    <script src="Js/dart-home-performance.js" defer></script>
    <script src="Js/dart-ui.home.min.js" defer></script>
    <script src="Js/dart-storefront.js" defer></script>
    <script src="Js/dart-dialog.js" defer></script>
    <script src="Js/dart-platform.home.min.js" defer></script>
</body>
</html>
