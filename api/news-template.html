<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} | Dart News</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <link rel="icon" href="/Photos/192px.png" type="image/png" sizes="192x192">
  <link rel="stylesheet" href="/CSS/news-article.css?v=20261008-news-v3">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Dart | for you">
  <meta property="og:title" content="{{title}} | Dart News">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{image}}">
  <meta property="og:image:alt" content="{{title}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}} | Dart News">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{image}}">
  {{publishedMeta}}
  <script type="application/ld+json">{{schema}}</script>
</head>
<body>
  <header class="news-page-header"><a class="news-page-brand" href="/">Dart <span>for you.</span></a><nav aria-label="Main"><a href="/">Home</a><a href="/products">Products</a><a href="/about.html">About</a></nav></header>
  <main id="main-content" class="news-page-main">{{article}}</main>
  <footer class="news-page-footer"><a href="/#dart-news">More from Dart News</a><a href="/Contact%20us.html">Contact Dart</a></footer>
</body>
</html>
