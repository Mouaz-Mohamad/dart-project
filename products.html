    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:image" content="https://dart-project-psi.vercel.app/Photos/1080px.png">
    <meta name="twitter:image:alt" content="شعار براند Dart for you للملابس الرجالية والشبابية">

    <!-- Favicon والأيقونات -->
    <link rel="icon" type="image/png" sizes="192x192" href="Photos/192px.png">
    <link rel="apple-touch-icon" sizes="192x192" href="Photos/192px.png">

    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Condensed:wght@400;500;600;700&family=Readex+Pro:wght@200;300;500;600;700&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "منتجات Dart for you - ملابس رجالي وشبابي",
      "url": "https://dart-project-psi.vercel.app/products",
      "description": "مجموعة Dart for you وDart Wear للملابس الرجالية والشبابية المتاحة بالألوان والمقاسات المختلفة.",
      "inLanguage": "ar-EG",
      "isPartOf": { "@id": "https://dart-project-psi.vercel.app/#website" }
    }
    </script>
</head>
<body class='dja-flexdir'>
    <div class="mother">
        <header id="header-container" aria-label="Main Navigation"></header>

        <main class="#">
            <h1 class="sr-only">منتجات Dart for you - ملابس رجالي وشبابي في مصر</h1>

            <!-- <section id="search-serial-container" aria-label="Product Authenticity Check"></section> -->
            
            <section id="leaderboard-card" aria-label="Dart Gift Card Leaderboard "></section>

            <button type="button" id="toggleProductFilters" class="product-filter-toggle" aria-controls="productFiltersPanel" aria-expanded="false">
                <i class="fa-solid fa-sliders" aria-hidden="true"></i>
                <span>Filter products</span>
                <i class="fa-solid fa-chevron-down product-filter-toggle-arrow" aria-hidden="true"></i>
            </button>

            <section id="productFiltersPanel" class="product-filter-panel" aria-label="Search and filter products" hidden>
                <div class="product-filter-search">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input id="productSearchInput" type="search" placeholder="Search by product name or code" aria-label="Search products by name or code" autocomplete="off">
                </div>
                <div class="product-filter-selects">
                    <select id="productSizeFilter" aria-label="Filter by size"><option value="all">All sizes</option></select>
                    <select id="productColorFilter" aria-label="Filter by color"><option value="all">All colors</option></select>
                    <select id="productAvailabilityFilter" aria-label="Filter by availability">
                        <option value="all">Any availability</option>
                        <option value="in-stock">In stock</option>
                        <option value="out-of-stock">Out of stock</option>
                    </select>
                    <select id="productPriceFilter" aria-label="Filter by price">
                        <option value="all">Any price</option>
                        <option value="under-500">Under 500 EGP</option>
                        <option value="500-750">500–750 EGP</option>
                        <option value="750-1000">751–1,000 EGP</option>
                        <option value="over-1000">Over 1,000 EGP</option>
                    </select>
                    <select id="productSortSelect" aria-label="Sort products">
                        <option value="featured">Featured order</option>
                        <option value="newest">Newest first</option>
                        <option value="price-low">Price: low to high</option>
                        <option value="price-high">Price: high to low</option>
                        <option value="name">Name: A to Z</option>
                    </select>
                    <button type="button" id="clearProductFilters" class="clear-product-filters">Clear</button>
                </div>
                <div class="product-filter-categories">
                    <span>Category</span>
                    <div class="filter-container" id="filterContainer"></div>
                </div>
                <p id="productResultsCount" class="product-results-count" role="status" aria-live="polite"></p>
            </section>

            <!-- ================= سكشن المنتجات الجزء الأول (أول 7 منتجات) ================= -->
            <section class="products-section">
                <h2 class="section-title-">&nbsp;Newest products</h2>
                
                <div class="products-grid" id="productsPart1">
                    <div class="product-card" id="productTemplate" style="display: none;">
                        <img src="" alt="Product photograph; description is filled from the product name" class="product-img" loading="lazy">
                        <div class="product-details">
                            <div class="product-category"></div>
                            <div class="product-code" dir="rtl"></div>
                            <div class="product-title"></div>
                            <div class="product-footer djasb">
                                <div class="product-pricing" data-product-pricing>
                                    <span class="product-old-price" data-product-price="old" hidden></span>
                                    <span class="product-price" data-product-price="current"></span>
                                    <span class="product-discount-badge" data-product-price="discount" hidden></span>
                                </div>
                                <button type="button" class="cart-btn dja">Buy &nbsp;<i class="fa-solid fa-bag-shopping"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="best-products-section">
                <h2 class="section-title-">&nbsp;Best Products</h2>
                <div class="x-scroll-container" id="bestProductsContainer"></div>
            </section>
            
            <section class="reviews-section">
                <h2 class="section-title-">&nbsp; Our Reviews </h2>
                <div class="reviews-container" id="reviewsContainer">
                    <div class="review-card" id="reviewTemplate" style="display: none;" dir="rtl">
                        <div>
                            <div class="stars"></div>
                            <div class="review-title"></div>
                            <div class="review-text"></div>
                        </div>
                        <div class="user-info" dir="rtl">
                            <i class="fa-regular fa-circle-user fa-xl user-avatar"></i>
                            <div>
                                <div class="user-name-"></div>
                                <div class="review-date"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="birthday"></section>

            <section class="products-section">
                <div class="products-grid" id="productsPart2"></div>
            </section>
            <!-- BEGIN Product-card dialogs: shared by the two product grids above. -->
            <div id="product-modal-host" data-section-src="sections/product-modal.html"></div>

                <section id="dartSetModal" class="dart-set-modal" role="dialog" aria-modal="true" aria-labelledby="dartSetModalTitle" hidden>
                    <div class="dart-set-dialog">
                        <button type="button" class="dart-set-close" data-set-close aria-label="Close Set details">&times;</button>
                        <div class="dart-set-gallery">
                            <img data-set-cover src="" alt="Set product gallery cover">
                            <div data-set-thumbs class="dart-set-thumbs"></div>
                        </div>
                        <article class="dart-set-details">
                            <small data-set-code></small>
                            <span class="dart-set-category">Sets</span>
                            <h2 id="dartSetModalTitle" data-set-title></h2>
                            <span data-set-old-price></span>
                            <strong data-set-price>Price :</strong> EGP <em data-set-discount></em>
                            <div data-set-components class="dart-set-components"></div>
                            <p data-set-description></p>
                            <div class="dart-set-pricing">
                            </div>
                            <p class="dart-set-status" data-set-status role="status" aria-live="polite"></p>
                            <button type="button" class="buy-now-btn" data-set-add>Add Set to Cart</button>
                        </article>
                    </div>
                </section>
            <!-- END Product-card dialogs. -->

            <section id="dart-for-you" aria-label="The brand logo is a kite bird in a burgundy color."></section>
            <section id="feedback-form" aria-label="Share Your Experience"></section>
        </main>

        <footer id="footer" aria-label="footer."></footer>
    
    </div>
    <script src="Js/dart-state.js" defer></script>
    <script src="Js/dart-site-settings.js" defer></script>
    <script src="Js/dart-catalog.js" defer></script>
    <script src="Js/dart-ui.js" defer></script>
    <script src="Js/dart-storefront.js" defer></script>
    <script src="Js/dart-dialog.js"></script>
    <script src="Js/dart-platform.js" defer></script>
</body>
</html>
