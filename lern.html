<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Cart & Checkout</title>
        <link rel="stylesheet" href="CSS/Stayle 1.css">
    <link rel="stylesheet" href="CSS/base.css">
    <style>
        .cart-section, .checkout-section {
    max-width: 400px;
    margin: 20px auto;
    padding: 15px;
}

.cart-product-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.cart-product-img {
    height: 100px;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 8px;
}

.cart-product-info {
    flex: 1;
    margin: 0 15px;
}

.cart-product-title {
    font-size: 20px;
    font-weight: 500;
    color: var(--bg-dark);
    margin-bottom: 4px;
}

.cart-product-specs {
    font-size: 12px;
    color: #777;
    margin-bottom: 6px;
}

.cart-product-price-qty {
    display: flex;
    align-items: center;
    gap: 15px;
}

.cart-item-price {
    font-weight: 700;
    color: #a30027;
    font-size: 16px;
}

.cart-item-total-price {
    font-size: 12px;
    color: #555;
    margin-top: 4px;
}

.qty-control {
    display: flex;
    align-items: center;
    border: 1px solid #ccc;
    border-radius: 4px;
    overflow: hidden;
    color: var(--bragnte);
}

.qty-btn {
    background: #f5f5f5;
    border: none;
    padding: 2px 8px;
    cursor: pointer;
    font-weight: bold;
        color: var(--bragnte);
}

.qty-btn:hover {
    background: #e0e0e0;
}

.qty-value {
    padding: 0 10px;
    font-size: 13px;
}

.remove-item-btn {
    background: none;
    border: none;
    color: #d32f2f;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
}

.remove-item-btn:hover {
    text-decoration: underline;
}

.primary-btn, .order-btn {
    width: 100%;
    background-color: #a30027;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
}

.primary-btn:hover, .order-btn:hover {
    background-color: #80001f;
}

.discount-box {
    display: flex;
    gap: 10px;
    margin: 15px 0;
}

.discount-box input {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--bragnte);
    border-radius: 4px;
    color: var(--bg-dark);
}

.discount-box button {
    padding: 0 20px;
    background: var(--bragnte);
    color: var(--white);
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
}

.totals-calculation {
    background: #f9f9f9;
    padding: 15px;
    border-radius: 6px;
    margin-bottom: 20px;
}

.calc-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 14px;
    color: #555;
}

.total-row {
    font-weight: 700;
    font-size: 16px;
    color: #000;
    border-top: 1px solid #ddd;
    padding-top: 8px;
    margin-top: 8px;
}
.address-header{ color: #000;}
.address-form .form-group {
    margin-bottom: 12px;
    width: 100%;
}
.select-cart{
    width: 100%;
}
.address-form label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
    width: 100%;
}

.address-form input, .address-form textarea {
    padding: 10px;
    border: 1px solid var(--bragnte);
    border-radius: 4px;
    font-size: 14px;
}
.inp{
    width: 100%;
}
.address-form textarea {
    height: 80px;
}
    </style>
</head>
<body class='dja-flexdir'>
    <div class="mother">
        <header id="header-container"></header>
            
        <main class="#">
            
            <!-- ================= أولاً: شاشة السلة (Shopping Cart) ================= -->
            <section id="cartView" class="cart-section">
                <div class="cart-items-container" id="cartItemsContainer">
                    <!-- قالب كارت المنتج في السلة -->
                    <div class="cart-product-card" id="cartItemTemplate" style="display: none;">
                        <img src="" alt="" class="cart-product-img">
                        
                        <div class="cart-product-info">
                            <div class="cart-product-title"></div>
                            <div class="cart-product-specs">
                                size : <span class="p-size"></span> &nbsp;|&nbsp; color : <span class="p-color"></span>
                            </div>
                            <div class="cart-product-price-qty">
                                <span class="cart-item-price"></span>
                                <div class="qty-control">
                                    <button class="qty-btn decrease">-</button>
                                    <span class="qty-value">1</span>
                                    <button class="qty-btn increase">+</button>
                                </div>
                            </div>
                            <div class="cart-item-total-price">Total: <span class="p-total"></span> EGP</div>
                        </div>

                        <button class="remove-item-btn">حذف</button>
                    </div>
                </div>

                <!-- زر الانتقال لإتمام الطلب -->
                <button class="primary-btn" id="toCheckoutBtn">Continue to Checkout</button>
            </section>


            <!-- ================= ثانياً: شاشة إتمام الطلب والعنوان (Checkout) (مخفية في البداية) ================= -->
            <section id="checkoutView" class="checkout-section" style="display: none;">
                
                <!-- ملخص المنتج وسعره -->
                <div class="checkout-summary-box" id="checkoutSummaryContainer"></div>

                <!-- خصم الكوبون -->
                <div class="discount-box">
                    <input type="text" placeholder="text your Discount" id="discountInput">
                    <button id="applyDiscountBtn" type="button">Apply</button>
                </div>

                <div class="totals-calculation">
                    <div class="calc-row"><span>Subtotal</span> <span id="subtotalVal">0 EGP</span></div>
                    <div class="calc-row"><span>Discount</span> <span id="discountVal">0 EGP</span></div>
                    <div class="calc-row total-row"><span>Total</span> <span id="totalVal">0 EGP</span></div>
                </div>

                <h3 class="address-header">Address___</h3>

                <!-- نموذج تفاصيل العنوان -->
                <form id="checkoutForm" class="address-form">
                    <div class="form-group"><label>Name</label><input class="inp" type="text" placeholder="Value" required></div>
                    <div class="form-group"><label>Email</label><input class="inp" type="email" placeholder="Value"></div>
                    <div class="form-group"><label>Phone number</label><input class="inp" type="tel" placeholder="Value" required></div>
                    <div class="form-group">
                        <label>Country</label>
                        <select required class="select-cart">
                            <option value="" selected disabled hidden> Select </option>
                            <option value="Country">Egypt</option> 
                        </select>                  
                    </div>
                    <div class="form-group">
                        <label>Governorate</label>
                        <select required class="select-cart">
                            <option value="" selected disabled hidden> Select </option>
                            <option value="Governorate">Cairo</option> 
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Area</label>
                        <select required class="select-cart">
                            <option value="" selected disabled hidden> Select </option>
                            <option value="wrong_size">المقاس غير مناسب</option>
                            <option value="defective">المنتج به عيب تصنيع أو تلف</option>
                            <option value="not_as_described">المنتج يختلف عن الصورة أو الوصف</option>
                            <option value="wrong_item">استلمت منتجًا مختلفًا عن طلبي</option>
                            
                            <!-- خيارات جودة أو تفضيل -->
                            <option value="quality_issue">خامة المنتج لم تعجبني</option>
                            <option value="changed_mind">لم أعد بحاجة إلى المنتج (تغيير رأي)</option>
                            <option value="missing_parts">يوجد نقص في محتويات الشحنة</option>
                            
                            <!-- خيار عام -->
                            <option value="other">سبب آخر</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Street Name</label><input class="inp" type="text" placeholder="Value" required></div>
                    <div class="form-group"><label>Building Number/Name</label><input class="inp" type="text" placeholder="Value"></div>
                    <div class="form-group"><label>Floor</label><input class="inp" type="text" placeholder="Value"></div>
                    <div class="form-group"><label>Delivery Notes</label><textarea class="inp" placeholder="Value"></textarea></div>

                    <h3 class="payment-header" style="color: #000;">Payment Method</h3>
                    <div class="payment-method-box dja">
                        <label class="dja" style="color: #000;"><input  type="checkbox" checked> Cash on Delivery</label>
                    </div>

                    <button type="submit" class="order-btn">Order</button>
                </form>
            </section>

        </main>

        <footer id="footer"></footer>
    </div>
    <script>
let cartData = [
    { id: 1, title: "تيشيرت بيزك", price: 540, size: "M", color: "black", quantity: 2, image: "Photos/products/1.jpg" },
    { id: 1, title: "تيشيرت بيزك", price: 540, size: "M", color: "black", quantity: 2, image: "Photos/products/1.jpg" },
];

let appliedDiscountRate = 0; // نسبة الخصم الافتراضية 0

document.addEventListener('DOMContentLoaded', () => {
    const cartView = document.getElementById('cartView');
    const checkoutView = document.getElementById('checkoutView');
    const toCheckoutBtn = document.getElementById('toCheckoutBtn');
    const applyDiscountBtn = document.getElementById('applyDiscountBtn');
    
    renderCart();

    // الانتقال لواجهة إتمام الطلب
    toCheckoutBtn.addEventListener('click', () => {
        cartView.style.display = 'none';
        checkoutView.style.display = 'block';
        renderCheckoutSummary();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // تفعيل زر Apply للكوبون
    applyDiscountBtn.addEventListener('click', () => {
        const discountInput = document.getElementById('discountInput').value.trim();
        
        // مثال: لو دخل كوبون اسمه "DART10" هياخد 10% خصم
        if (discountInput === "DART10") {
            appliedDiscountRate = 0.10; // 10% خصم
            alert("تم تطبيق الكوبون بنجاح!");
        } else if (discountInput === "") {
            appliedDiscountRate = 0;
            alert("من فضلك أدخل كود الخصم");
        } else {
            appliedDiscountRate = 0;
            alert("كود الخصم غير صحيح");
        }
        
        renderCheckoutSummary(); // تحديث الحسابات بعد الكوبون
    });
});

function renderCart() {
    const container = document.getElementById('cartItemsContainer');
    const template = document.getElementById('cartItemTemplate');
    
    container.querySelectorAll('.cart-product-card:not(#cartItemTemplate)').forEach(el => el.remove());

    cartData.forEach((item, index) => {
        const card = template.cloneNode(true);
        card.removeAttribute('id');
        card.style.display = 'flex';

        card.querySelector('.cart-product-img').src = item.image;
        card.querySelector('.cart-product-title').textContent = item.title;
        card.querySelector('.p-size').textContent = item.size;
        card.querySelector('.p-color').textContent = item.color;
        card.querySelector('.cart-item-price').textContent = `${item.price} EGP`;
        card.querySelector('.qty-value').textContent = item.quantity;
        card.querySelector('.p-total').textContent = item.price * item.quantity;

        card.querySelector('.increase').addEventListener('click', () => {
            cartData[index].quantity += 1;
            renderCart();
        });

        card.querySelector('.decrease').addEventListener('click', () => {
            if (cartData[index].quantity > 1) {
                cartData[index].quantity -= 1;
                renderCart();
            }
        });

        card.querySelector('.remove-item-btn').addEventListener('click', () => {
            cartData.splice(index, 1);
            renderCart();
        });

        container.appendChild(card);
    });
}

function renderCheckoutSummary() {
    const summaryContainer = document.getElementById('checkoutSummaryContainer');
    summaryContainer.innerHTML = '';

    let subtotal = 0;

    cartData.forEach(item => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;

        const box = document.createElement('div');
        box.className = 'cart-product-card';
        box.innerHTML = `
            <img src="${item.image}" alt="" class="cart-product-img">
            <div class="cart-product-info">
                <div class="cart-product-title">${item.title}</div>
                <div class="cart-product-specs">size : ${item.size} | color : ${item.color}</div>
                <div class="cart-product-price-qty">
                    <span class="cart-item-price">${item.price} EGP</span>
                    <span>Qty: ${item.quantity}</span>
                </div>
                <div class="cart-item-total-price">Total: ${itemTotal} EGP</div>
            </div>
        `;
        summaryContainer.appendChild(box);
    });

    // حساب قيمة الخصم والإجمالي النهائي
    let discountAmount = subtotal * appliedDiscountRate;
    let finalTotal = subtotal - discountAmount;

    document.getElementById('subtotalVal').textContent = `${subtotal} EGP`;
    document.getElementById('discountVal').textContent = `${discountAmount} EGP`;
    document.getElementById('totalVal').textContent = `${finalTotal} EGP`;
}
    </script>
</body>
</html>
