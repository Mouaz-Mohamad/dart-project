# DART CODE GUIDE | backend/openapi.yaml
# الغرض: العقد التشغيلي للـHTTP APIs الحساسة والمعلنة في Dart.
openapi: 3.1.0
info:
  title: Dart Backend API
  version: 0.6.2
  description: Server-authoritative API for Dart | for you. PostgreSQL owns business state. Authenticated mutations use Secure HttpOnly sessions and CSRF.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Customer Auth
  - name: Staff Auth
  - name: Representative Auth
  - name: Sessions
  - name: Orders
  - name: Analytics
  - name: Settings
  - name: Promotions
  - name: Dart Card
  - name: Internal Jobs
  - name: Sets
  - name: News
paths:
  /admin/orders-state:
    get:
      tags: [Orders]
      operationId: readAdminOrdersSnapshot
      security: [{ sessionCookie: [] }]
      description: Requires Staff orders.read and configured MFA. Read-only version and orders from one repeatable-read database snapshot. Never cached.
      responses:
        "200": { description: Consistent version and complete orders array }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Orders]
      operationId: rejectLegacyOrdersReplacement
      deprecated: true
      security: [{ sessionCookie: [], csrfToken: [] }]
      description: Whole-order replacement is disabled. Authorized callers receive ORDER_COMMAND_REQUIRED; use individual create, edit, workflow or archive commands.
      responses:
        "405": { description: ORDER_COMMAND_REQUIRED with Allow GET; no database write }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/orders/{orderRef}/workflow:
    post:
      tags: [Orders]
      operationId: adminOrderWorkflowCommand
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { in: path, name: orderRef, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
        - { $ref: "#/components/parameters/OrderResponseMode" }
        - { $ref: "#/components/parameters/OrderBaseVersion" }
      description: Requires Staff orders.manage or orders.bulk_manage and configured MFA. The server locks the order and validates expectedStatus and transitions, inventory, rewards and COD eligibility in one audited transaction. Optional delta replies include affected-customer orders only at a contiguous version. After commit, a gap or failed snapshot refresh returns 200 with refreshRequired true; this is a committed command and must not be automatically retried.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderWorkflowCommand" }
      responses:
        "200": { $ref: "#/components/responses/AdminOrderCommandState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/orders:
    post:
      tags: [Orders]
      operationId: createAdminOrderCommand
      security: [{ sessionCookie: [], csrfToken: [] }]
      description: Existing manual-create command. Requires orders.manage or orders.create and configured MFA. Server-authoritative pricing, held inventory and audit are unchanged by the optional response mode.
      parameters:
        - { $ref: "#/components/parameters/OrderResponseMode" }
        - { $ref: "#/components/parameters/OrderBaseVersion" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminManualOrderCommand" }
      responses:
        "201": { $ref: "#/components/responses/AdminOrderCommandState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/orders/{orderRef}:
    patch:
      tags: [Orders]
      operationId: updateAdminOrderCommand
      security: [{ sessionCookie: [], csrfToken: [] }]
      description: Existing manual-edit command. Requires orders.manage or orders.edit and configured MFA. Delivered/returned financial snapshots stay locked. A delta includes orders for both previous and current affected customers.
      parameters:
        - { in: path, name: orderRef, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
        - { $ref: "#/components/parameters/OrderResponseMode" }
        - { $ref: "#/components/parameters/OrderBaseVersion" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminManualOrderCommand" }
      responses:
        "200": { $ref: "#/components/responses/AdminOrderCommandState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/orders/{orderRef}/state:
    post:
      tags: [Orders]
      operationId: adminOrderArchiveCommand
      security: [{ sessionCookie: [], csrfToken: [] }]
      description: Existing archive/restore/soft-delete command. Requires the central action-specific permission and MFA. Active orders remain protected and financial history is preserved.
      parameters:
        - { in: path, name: orderRef, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
        - { $ref: "#/components/parameters/OrderResponseMode" }
        - { $ref: "#/components/parameters/OrderBaseVersion" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [archive, restore, delete] }
      responses:
        "200": { $ref: "#/components/responses/AdminOrderCommandState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/orders/bulk-workflow:
    post:
      tags: [Orders]
      operationId: adminBulkOrderWorkflowCommand
      security: [{ sessionCookie: [], csrfToken: [] }]
      description: Requires Staff orders.bulk_manage and configured MFA. Uses the same workflow command and expectedStatus check independently for every order. Returns per-order succeeded and failed results plus the latest snapshot or refreshRequired true. A successful member is not rolled back when another member fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/OrderWorkflowFields" }
              type: object
              required: [orderRefs, expectedStatus, target]
              unevaluatedProperties: false
              properties:
                orderRefs: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 160 } }
      responses:
        "200": { description: Confirmed per-order results and snapshot }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /news:
    get:
      tags: [News]
      operationId: listPublicNews
      summary: List published, non-archived News summaries
      description: Manual sortOrder ascending first, then newest publication first. Full body and staff metadata are omitted. Unknown query fields are rejected.
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200": { description: News summaries, total and nullable nextOffset }
        "422": { $ref: "#/components/responses/ValidationError" }
  /news/{id}:
    get:
      tags: [News]
      operationId: getPublicNews
      summary: Read the complete plain-text published article
      parameters:
        - { $ref: "#/components/parameters/NewsId" }
      responses:
        "200": { description: News summary plus plain-text body }
        "404": { description: Missing, draft or archived News }
  /admin/news:
    get:
      tags: [News]
      operationId: listAdminNews
      security: [{ sessionCookie: [] }]
      description: Requires Staff news.read or news.manage. Includes draft, archive, full text and version metadata.
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 160 } }
        - { in: query, name: status, schema: { type: string, enum: [all, draft, published], default: all } }
        - { in: query, name: archive, schema: { type: string, enum: [active, archived, all], default: active } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200": { description: News records, total and nullable nextOffset }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [News]
      operationId: createNews
      security: [{ sessionCookie: [], csrfToken: [] }]
      description: Requires Staff news.manage and MFA when configured. Repeating the same newsId and payload by the creator is safe. All writes are audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsCreate" }
      responses:
        "201": { description: Created News with version }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/news/{id}:
    get:
      tags: [News]
      operationId: getAdminNews
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/NewsId" }
      description: Requires Staff news.read or news.manage; permits draft and archived previews.
      responses:
        "200": { description: Complete News and version metadata }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: News does not exist }
    put:
      tags: [News]
      operationId: updateNews
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/NewsId" }
      description: Requires Staff news.manage and MFA when configured. Stale versions and edits of archived News return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsUpdate" }
      responses:
        "200": { description: Updated News with incremented version }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/news/{id}/state:
    post:
      tags: [News]
      operationId: archiveOrRestoreNews
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/NewsId" }
      description: Requires Staff news.manage and MFA when configured. Archive hides News without deleting it; restore preserves publication status. Repeated identical state is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsState" }
      responses:
        "200": { description: Archived or restored News }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/news/assets:
    put:
      tags: [News]
      operationId: uploadNewsCover
      security: [{ sessionCookie: [], csrfToken: [] }]
      description: Requires Staff news.manage and MFA when configured, independently of catalog permissions. JPG, PNG or WebP real image bytes up to 4 MiB; NEWSIMG namespace only. Rate limit 30 uploads per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsAsset" }
      responses:
        "200": { description: Asset id and versioned urlPath }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /sets:
    get:
      tags: [Sets]
      operationId: getPublicSets
      summary: Read active Sets including homepage presentation and server-calculated prices
      responses:
        "200": { description: Active non-archived Sets; no private cost data }
  /sets/{setId}:
    get:
      tags: [Sets]
      operationId: getPublicSet
      parameters:
        - { in: path, name: setId, required: true, schema: { type: string } }
      responses:
        "200": { description: Set detail including shortDescription, showOnHomepage and homepageOrder }
        "404": { description: Set does not exist or is unavailable for public viewing }
  /admin/sets:
    post:
      tags: [Sets]
      operationId: createSet
      security: [{ sessionCookie: [], csrfToken: [] }]
      description: Requires staff sets.manage; visible homepage cards require an uploaded Set image.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetCreate" }
      responses:
        "201": { description: Created Set }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/sets/{setId}:
    put:
      tags: [Sets]
      operationId: updateSet
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { in: path, name: setId, required: true, schema: { type: string } }
      description: Requires staff sets.manage and expectedVersion; omitted homepage fields preserve saved values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetUpdate" }
      responses:
        "200": { description: Updated Set with homepage audit before/after values }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      responses:
        "200": { description: API process is running }
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        "200": { description: Required dependencies are ready }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/register:
    post:
      tags: [Customer Auth]
      summary: Register a customer and create the customer session immediately
      description: Customer signup is not gated by Email OTP. Birthday is required for every new customer account. Email OTP remains available for explicit verification/recovery flows.
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerRegistration" }
      responses:
        "201": { $ref: "#/components/responses/Authenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/verify-email:
    post:
      tags: [Customer Auth]
      summary: Consume an explicit Email verification challenge and create/replace the customer session
      operationId: verifyCustomerEmail
      responses:
        "200": { $ref: "#/components/responses/Authenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/resend-verification:
    post:
      tags: [Customer Auth]
      summary: Replace an existing Email verification challenge
      operationId: resendCustomerVerification
      responses:
        "202": { description: Replacement verification challenge }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/login:
    post:
      tags: [Customer Auth]
      operationId: loginCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Login" }
      responses:
        "200": { $ref: "#/components/responses/Authenticated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/social/providers:
    get:
      tags: [Customer Auth]
      summary: Return which customer social providers are configured server-side
      operationId: getCustomerSocialProviders
      responses:
        "200": { description: Google/Facebook provider availability; no provider secrets are returned }
  /auth/social/{provider}/start:
    get:
      tags: [Customer Auth]
      summary: Start server-side Google or Facebook OAuth authorization-code flow
      operationId: startCustomerSocialAuth
      parameters:
        - { $ref: "#/components/parameters/SocialProvider" }
        - { in: query, name: next, required: false, schema: { type: string, enum: [profile, checkout], default: profile } }
      responses:
        "303": { description: Redirect to the provider authorization page }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/social/{provider}/callback:
    get:
      tags: [Customer Auth]
      summary: Provider callback. Exchanges the authorization code server-side and redirects to Dart completion using a one-time fragment capability.
      operationId: completeCustomerSocialProviderCallback
      parameters:
        - { $ref: "#/components/parameters/SocialProvider" }
        - { in: query, name: code, required: false, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
      responses:
        "303": { description: Redirect to the Dart customer completion screen }
  /auth/social/challenge:
    post:
      tags: [Customer Auth]
      summary: Read safe profile hints without putting the one-time social capability in request URLs
      operationId: getCustomerSocialChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 40, maxLength: 500 }
      responses:
        "200": { description: Provider, verified email, new/existing account state and required completion fields }
        "400": { $ref: "#/components/responses/ValidationError" }
  /auth/social/complete:
    post:
      tags: [Customer Auth]
      summary: Finish Google/Facebook customer authentication with Dart Password + confirmation + Birthday
      description: Every social completion requires a Dart local Password + confirmation + Birthday. A new social customer also supplies name and primary phone. Existing saved Birthday is preserved; the submitted Birthday only fills a legacy missing value. Provider OAuth access/refresh tokens are never stored.
      operationId: completeCustomerSocialAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialAuthComplete" }
      responses:
        "200": { $ref: "#/components/responses/Authenticated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/forgot-password:
    post:
      tags: [Customer Auth, Representative Auth]
      operationId: requestPasswordReset
      responses:
        "202": { description: Non-enumerating reset challenge response }
  /auth/reset-password:
    post:
      tags: [Customer Auth, Representative Auth]
      summary: Consume reset OTP and replace the account password
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordReset" }
      responses:
        "200": { description: Password changed }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/change-password:
    post:
      tags: [Customer Auth]
      operationId: changeCustomerPassword
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Authenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/change-temporary-password:
    post:
      tags: [Customer Auth, Representative Auth]
      operationId: changeTemporaryPassword
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Authenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/refresh:
    post:
      tags: [Sessions]
      operationId: refreshSession
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "200": { description: Rotated CSRF token and expiry }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Sessions]
      operationId: logout
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "204": { description: Session revoked }
  /auth/logout-all:
    post:
      tags: [Sessions]
      operationId: logoutAll
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "204": { description: All sessions revoked }
  /auth/sessions:
    get:
      tags: [Sessions]
      operationId: listOwnSessions
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Active session list }
  /auth/sessions/{sessionId}:
    delete:
      tags: [Sessions]
      operationId: revokeOwnSession
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Session revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /me:
    get:
      tags: [Sessions]
      operationId: getMe
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Signed-in profile and permissions }
    patch:
      tags: [Customer Auth]
      summary: Update customer profile. Birthday changes are audited and cannot create a second used Birthday reward in the same year.
      operationId: updateMe
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "200": { description: Updated profile }
        "409": { $ref: "#/components/responses/Conflict" }

  /representatives/register:
    post:
      tags: [Representative Auth]
      operationId: registerRepresentative
      responses:
        "202": { description: Representative application accepted when secure document storage is available }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /representatives/login:
    post:
      tags: [Representative Auth]
      operationId: loginRepresentative
      responses:
        "200": { $ref: "#/components/responses/Authenticated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/auth/email/start:
    post:
      tags: [Staff Auth]
      operationId: startStaffEmailAccess
      responses:
        "202": { description: Generic Staff Email challenge response }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/auth/email/resend:
    post:
      tags: [Staff Auth]
      operationId: resendStaffEmailAccess
      responses:
        "202": { description: Generic replacement challenge response }
  /admin/auth/email/verify:
    post:
      tags: [Staff Auth]
      operationId: verifyStaffEmailAccess
      responses:
        "200": { $ref: "#/components/responses/Authenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/staff:
    get:
      tags: [Staff Auth]
      operationId: listStaffAccess
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Staff directory and permission catalogue }
  /admin/staff/allowlist:
    post:
      tags: [Staff Auth]
      operationId: allowStaffEmail
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "201": { description: Staff Email allowance created }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/staff/allowlist/{id}:
    delete:
      tags: [Staff Auth]
      operationId: removeStaffEmailAccess
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Pending allowance removed }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/staff/{id}/access:
    patch:
      tags: [Staff Auth]
      operationId: setStaffAccessStatus
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Staff access state updated }
  /admin/staff/{id}/sessions/revoke:
    post:
      tags: [Staff Auth]
      operationId: revokeStaffSessions
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Staff sessions revoked }

  /orders:
    post:
      tags: [Orders, Promotions]
      summary: Create an order from an active reservation. Promotion eligibility is re-evaluated server-side before the Commerce transaction.
      operationId: createOrder
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "201": { description: Order created }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/orders/{orderRef}/cod-verification:
    post:
      tags: [Orders]
      operationId: decideCodVerification
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { in: path, name: orderRef, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
        - { $ref: "#/components/parameters/OrderResponseMode" }
        - { $ref: "#/components/parameters/OrderBaseVersion" }
      responses:
        "200": { $ref: "#/components/responses/AdminOrderCommandState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/live-operations:
    get:
      tags: [Orders]
      summary: Read active representatives, assigned delivery stops, and unassigned map orders.
      operationId: getAdminLiveOperations
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Live operations snapshot }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/live-operations/route:
    post:
      tags: [Orders]
      summary: Resolve a real road-following route through the server-side routing provider adapter.
      operationId: getAdminLiveRoadRoute
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: array
                  minItems: 2
                  maxItems: 100
                  items:
                    type: object
                    required: [latitude, longitude]
                    properties:
                      latitude: { type: number, minimum: -90, maximum: 90 }
                      longitude: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200": { description: Road geometry split into consecutive route segments }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: Route provider unavailable }

  /analytics/events:
    post:
      tags: [Analytics]
      summary: Record a first-party website visit or successful Add to Cart action.
      operationId: recordTrafficAnalyticsEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrafficAnalyticsEvent" }
      responses:
        "202": { description: Analytics event accepted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/analytics/traffic:
    get:
      tags: [Analytics]
      summary: Read authoritative website traffic and conversion funnel analytics for a selected Brand period.
      operationId: getTrafficAnalytics
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: start, required: true, schema: { type: string, format: date } }
        - { in: query, name: end, required: true, schema: { type: string, format: date } }
        - { in: query, name: group, required: false, schema: { type: string, enum: [hourly, daily, weekly, monthly, yearly], default: daily }, description: Hourly grouping is limited to a 31-day range. }
      responses:
        "200": { description: Unique visitors, visits, Add to Cart funnel, website orders, ordered pieces, grouped series and per-visitor details }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /site-settings:
    get:
      tags: [Settings]
      summary: Read public allowlisted Site Settings; private COD policy is never returned.
      operationId: getPublicSiteSettings
      responses:
        "200": { description: Public settings and version }
        "304": { description: ETag unchanged }
  /admin/site-settings:
    get:
      tags: [Settings]
      operationId: getAdminSiteSettings
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Full admin settings and version }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Settings]
      operationId: updateSiteSettings
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteSettingsUpdate" }
      responses:
        "200": { description: Updated settings }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/promotions/validate-v2:
    get:
      tags: [Promotions]
      operationId: validatePromotionV2
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: code, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
      responses:
        "200": { description: Dynamic customer campaign eligibility result }
  /me/promotions/resolve:
    get:
      tags: [Promotions]
      operationId: resolveAutomaticPromotion
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: reservationId, required: true, schema: { type: string, minLength: 16, maxLength: 160 } }
        - { in: query, name: code, required: false, schema: { type: string, minLength: 1, maxLength: 60 } }
      responses:
        "200": { description: Highest-priority automatic campaign eligible for the reserved cart, or null }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/promotions:
    get:
      tags: [Promotions]
      operationId: listPromotions
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Promotion campaign list }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Promotions]
      operationId: createPromotion
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionCampaign" }
      responses:
        "201": { description: Promotion created }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/promotions/{id}:
    put:
      tags: [Promotions]
      operationId: updatePromotion
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, minLength: 8, maxLength: 160 } }
      responses:
        "200": { description: Promotion updated }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/promotions/{id}/analytics:
    get:
      tags: [Promotions]
      operationId: promotionAnalytics
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, minLength: 8, maxLength: 160 } }
      responses:
        "200": { description: Reservations, usages, customers, revenue, pieces, AOV and conversion }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/dart-card/draws:
    get:
      tags: [Dart Card]
      operationId: listDartCardDraws
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 120, default: 24 } }
      responses:
        "200": { description: Audited draw history including every winner }
  /admin/dart-card/draws/{period}/preview:
    get:
      tags: [Dart Card]
      summary: Preview ranking by pieces then net spending and up to three exact-tie winners
      operationId: previewDartCardDraw
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/DrawPeriod" }
      responses:
        "200": { description: Eligible ranking ordered by pieces then net spending plus exact-tie winner count }
  /admin/dart-card/draws/{period}/run:
    post:
      tags: [Dart Card]
      summary: Run the idempotent monthly draw. Exact top ties all win up to 3; if 4+ are exactly tied, 3 distinct customers are selected randomly.
      operationId: runDartCardDraw
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/DrawPeriod" }
      responses:
        "200": { description: Idempotent monthly draw result containing one to three winners and their awarded Dart Cards }
        "403": { $ref: "#/components/responses/Forbidden" }
  /internal/dart-card/monthly-draw:
    get:
      tags: [Internal Jobs, Dart Card]
      operationId: runDueDartCardDrawGet
      security: [{ internalBearer: [] }]
      responses:
        "200": { description: Previous Cairo month draw result }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Internal Jobs, Dart Card]
      operationId: runDueDartCardDrawPost
      security: [{ internalBearer: [] }]
      responses:
        "200": { description: Previous Cairo month draw result }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /internal/outbox/process:
    get:
      tags: [Internal Jobs]
      operationId: processOutboxGet
      security: [{ internalBearer: [] }]
      responses:
        "200": { description: Outbox batch result }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Internal Jobs]
      operationId: processOutboxPost
      security: [{ internalBearer: [] }]
      responses:
        "200": { description: Outbox batch result }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dart_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    internalBearer:
      type: http
      scheme: bearer
  parameters:
    OrderResponseMode:
      in: query
      name: responseMode
      description: Opt in to a version-guarded delta. Omit to retain the legacy full snapshot.
      schema: { type: string, enum: [delta] }
    OrderBaseVersion:
      in: query
      name: baseVersion
      description: Last confirmed orders snapshot version. Missing/zero versions require full client recovery; gaps never apply a partial snapshot.
      schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
    NewsId:
      in: path
      name: id
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,120}$" }
    DrawPeriod:
      in: path
      name: period
      required: true
      schema: { type: string, pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$" }
    SocialProvider:
      in: path
      name: provider
      required: true
      schema: { type: string, enum: [google, facebook] }
  schemas:
    AdminOrderCommandState:
      type: object
      required: [version, orders]
      properties:
        version: { type: integer, minimum: 1 }
        orders: { type: array, items: { type: object } }
        responseMode: { type: string, enum: [delta] }
        baseVersion: { type: integer, minimum: 1 }
        refreshRequired: { type: boolean, description: The command committed; retain current rows and fetch GET orders-state. Never retry the write automatically. }
    AdminManualOrderCommand:
      type: object
      required: [clientName, phone1, itemCodes]
      properties:
        clientId: { type: string, maxLength: 120 }
        clientName: { type: string, minLength: 2, maxLength: 160 }
        phone1: { type: string, minLength: 7, maxLength: 40 }
        phone2: { type: string, maxLength: 40 }
        email: { type: string, maxLength: 320 }
        paymentMethod: { type: string, minLength: 1, maxLength: 80 }
        paymentStatus: { type: string, enum: [Unpaid, Partially Paid, Paid, Refunded, Partially Refunded, Void] }
        amountPaid: { type: number, minimum: 0, description: Legacy display-currency input; server clamps and stores integer minor units. }
        amountRefunded: { type: number, minimum: 0, description: Legacy display-currency input; server clamps and stores integer minor units. }
        orderSource: { type: string, maxLength: 80 }
        deliveryNotes: { type: string, maxLength: 1000 }
        itemCodes: { type: array, minItems: 1, maxItems: 50, items: { type: string, minLength: 1, maxLength: 120 } }
        discountPercent: { type: number, minimum: 0, maximum: 100 }
        country: { type: string, maxLength: 120 }
        governorate: { type: string, maxLength: 120 }
        area: { type: string, maxLength: 160 }
        street: { type: string, maxLength: 200 }
        building: { type: string, maxLength: 120 }
        floor: { type: string, maxLength: 80 }
        latitude: { type: string, maxLength: 80 }
        longitude: { type: string, maxLength: 80 }
        fullAddress: { type: string, maxLength: 600 }
    OrderWorkflowFields:
      type: object
      required: [expectedStatus, target]
      properties:
        expectedStatus: { type: string, minLength: 1, maxLength: 80 }
        target: { type: string, enum: [New, Accepted, Preparing, Out With Representative, Representative On The Way, Delivered, Refused, Cancelled] }
        representativeId: { type: string, maxLength: 160 }
        deliveryGroupId: { type: string, maxLength: 160 }
        reason: { type: string, maxLength: 500 }
        notes: { type: string, maxLength: 1500 }
    OrderWorkflowCommand:
      allOf:
        - { $ref: "#/components/schemas/OrderWorkflowFields" }
      unevaluatedProperties: false
    NewsCreate:
      type: object
      additionalProperties: false
      required: [newsId, title, body, coverAssetId, status]
      properties:
        newsId: { type: string, pattern: "^[A-Za-z0-9_-]{1,120}$" }
        title: { type: string, minLength: 1, maxLength: 160 }
        excerpt: { type: string, maxLength: 280, default: "" }
        body: { type: string, minLength: 1, maxLength: 30000, description: Plain text only; rendered without HTML interpretation. }
        coverAssetId: { type: string, pattern: "^[A-Za-z0-9_-]{8,120}$" }
        status: { type: string, enum: [draft, published] }
        sortOrder: { type: [integer, "null"], minimum: 0, maximum: 9999, default: null }
    NewsUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion, title, body, coverAssetId, status]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 160 }
        excerpt: { type: string, maxLength: 280, default: "" }
        body: { type: string, minLength: 1, maxLength: 30000, description: Plain text only; rendered without HTML interpretation. }
        coverAssetId: { type: string, pattern: "^[A-Za-z0-9_-]{8,120}$" }
        status: { type: string, enum: [draft, published] }
        sortOrder: { type: [integer, "null"], minimum: 0, maximum: 9999, default: null }
    NewsState:
      type: object
      additionalProperties: false
      required: [action, expectedVersion]
      properties:
        action: { type: string, enum: [archive, restore] }
        expectedVersion: { type: integer, minimum: 1 }
    NewsAsset:
      type: object
      additionalProperties: false
      required: [assetId, contentType, base64]
      properties:
        assetId: { type: string, pattern: "^NEWSIMG-[A-Za-z0-9_-]{8,100}$" }
        originalName: { type: string, maxLength: 255, default: "" }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        base64: { type: string, minLength: 4, maxLength: 5600000, pattern: "^[A-Za-z0-9+/]+={0,2}$" }
    SetWrite:
      type: object
      required: [name, basePriceMinor, components]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 4000 }
        shortDescription: { type: string, maxLength: 280 }
        showOnHomepage: { type: boolean }
        homepageOrder: { type: integer, minimum: 0, maximum: 9999 }
        basePriceMinor: { type: integer, minimum: 0, maximum: 1000000000 }
        discountPercent: { type: number, minimum: 0, maximum: 100 }
        images: { type: array, maxItems: 30, items: { type: string, maxLength: 1200 } }
        components:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [modelId]
            properties:
              modelId: { type: string, minLength: 1, maxLength: 120 }
              quantity: { type: integer, minimum: 1, maximum: 20, default: 1 }
    SetCreate:
      allOf:
        - { $ref: "#/components/schemas/SetWrite" }
        - type: object
          required: [setId]
          properties:
            setId: { type: string, minLength: 1, maxLength: 120, pattern: "^[A-Za-z0-9_-]+$" }
    SetUpdate:
      allOf:
        - { $ref: "#/components/schemas/SetWrite" }
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, minimum: 1 }
    TrafficAnalyticsEvent:
      type: object
      additionalProperties: false
      required: [eventType, visitorId, sessionId]
      properties:
        eventType: { type: string, enum: [visit, add_to_cart] }
        eventId: { type: string, format: uuid, description: Required for Add to Cart events; used for idempotency. }
        visitorId: { type: string, format: uuid, description: First-party anonymous visitor identifier. }
        sessionId: { type: string, format: uuid, description: Browser session identifier; visits are deduplicated per visitor/session. }
        path: { type: string, maxLength: 500 }
        modelId: { type: string, minLength: 1, maxLength: 160 }
        color: { type: string, maxLength: 120 }
        size: { type: string, maxLength: 80 }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        reservationId: { type: string, minLength: 1, maxLength: 180, description: Required for add_to_cart and validated against the active reserved cart variant and its signed-in/guest browser owner. }
    CustomerPassword:
      type: string
      minLength: 6
      maxLength: 200
      description: Customer password with at least 6 characters and any character composition; letters, digits, symbols, spaces and non-Latin text are allowed.
      writeOnly: true
    PasswordCandidate:
      type: string
      minLength: 6
      maxLength: 200
      description: Reset/temporary-password candidate; the server applies the account-type-specific policy after resolving the account.
      writeOnly: true
    StrongPassword:
      type: string
      minLength: 12
      maxLength: 200
      pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{12,200}$"
      description: Representative operational password; lowercase, uppercase and a digit are required.
      writeOnly: true
    CustomerRegistration:
      type: object
      additionalProperties: false
      required: [name, email, phone1, birthday, password]
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone1: { type: string, minLength: 10, maxLength: 25 }
        phone2: { type: string, minLength: 10, maxLength: 25 }
        birthday: { type: string, format: date }
        password: { $ref: "#/components/schemas/CustomerPassword" }
    SocialAuthComplete:
      type: object
      additionalProperties: false
      required: [token, password, confirmation, birthday]
      properties:
        token: { type: string, minLength: 40, maxLength: 500, writeOnly: true }
        password: { $ref: "#/components/schemas/CustomerPassword" }
        confirmation: { $ref: "#/components/schemas/CustomerPassword" }
        birthday: { type: string, format: date }
        name: { type: string, minLength: 3, maxLength: 120, description: Required by the service when the provider identity does not already map to a Dart customer }
        phone1: { type: string, minLength: 10, maxLength: 25, description: Required by the service for a new social customer }
        phone2: { type: string, minLength: 10, maxLength: 25 }
    Login:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200, writeOnly: true }
    PasswordReset:
      type: object
      additionalProperties: false
      required: [challengeId, code, password, confirmation]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: "^[0-9]{6}$" }
        password: { $ref: "#/components/schemas/PasswordCandidate" }
        confirmation: { $ref: "#/components/schemas/PasswordCandidate" }
    Profile:
      type: object
      required: [id, accountType, code, name, email, phones, status]
      properties:
        id: { type: string, format: uuid }
        accountType: { type: string, enum: [customer, staff, representative] }
        code: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phones: { type: array, items: { type: string } }
        birthday: { type: [string, "null"], format: date }
        status: { type: string }
        emailVerified: { type: boolean }
        mustChangePassword: { type: boolean }
    Authenticated:
      type: object
      required: [user, csrfToken]
      properties:
        user: { $ref: "#/components/schemas/Profile" }
        csrfToken: { type: string, writeOnly: true }
    SiteSettingsUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion, settings]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        settings:
          type: object
          description: Strict known SiteSettings root keys. Unknown root keys are rejected by the Zod contract.
    PromotionRule:
      oneOf:
        - type: object
          required: [field, operator, value]
          additionalProperties: false
          properties:
            field: { type: string, enum: [ordersCount, purchasedPieces, totalSpendingMinor, lastOrderDaysAgo, customerId, accountAgeDays, isBirthday] }
            operator: { type: string, enum: [eq, ne, gt, gte, lt, lte, between, in, notIn] }
            value: {}
        - type: object
          required: [mode, rules]
          additionalProperties: false
          properties:
            mode: { type: string, enum: [AND, OR] }
            rules:
              type: array
              minItems: 1
              maxItems: 50
              items: { $ref: "#/components/schemas/PromotionRule" }
    PromotionCampaign:
      type: object
      additionalProperties: false
      required: [name, code, discountPercent]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        code: { type: string, minLength: 2, maxLength: 60, pattern: "^[A-Za-z0-9_-]+$" }
        status: { type: string, enum: [Draft, Scheduled, Active, Paused, Expired], default: Draft }
        discountPercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
        maxDiscountPercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
        startsAt: { type: string, format: date }
        endsAt: { type: string, format: date }
        automatic: { type: boolean, default: false }
        priority: { type: integer, minimum: 0, maximum: 10000, default: 100 }
        minOrderMinor: { type: integer, minimum: 0 }
        minQuantity: { type: integer, minimum: 1, maximum: 100, default: 1 }
        totalUsageLimit: { type: integer, minimum: 0 }
        perCustomerUsageLimit: { type: integer, minimum: 0 }
        limitBasis: { type: string, enum: [orders, customers], default: orders }
        audience: { type: string, enum: [all, noPreviousOrders, previousCustomers, advanced], default: all }
        customerRules: { $ref: "#/components/schemas/PromotionRule" }
        productScope:
          type: object
          additionalProperties: false
          required: [mode, values]
          properties:
            mode: { type: string, enum: [all, categories, models, products] }
            values: { type: array, maxItems: 500, items: { type: string } }
        stacking: { type: string, const: none, default: none }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: {}
  responses:
    AdminOrderCommandState:
      description: Confirmed command with a complete legacy snapshot, an opted-in affected-order delta, or refreshRequired true with an empty placeholder orders array.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminOrderCommandState" }
    Authenticated:
      description: Authenticated session created or replaced
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Authenticated" }
    Unauthorized:
      description: Authentication failed, internal bearer failed, or session expired
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Duplicate, exhausted eligibility, or stale state conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Request/schema/business validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServiceUnavailable:
      description: Required secure integration is unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
