    <body class="dart-serial-page">
            <div class="mother">
                <header id="header-container" aria-label="Main Navigation"></header>
                <main>
                    <section class="search-serial dja-flexdir margin-top" aria-label="Product Authenticity Check | التحقق من أصالة القطعة">
                        <h1>Trace your unique edition</h1>
                        <form class="search-container dja" id="serialSearchForm" novalidate>
                        <label class="sr-only" for="serialNumber">Item serial number</label>
                            <input type="text" id="serialNumber" name="serial_number" placeholder="Item code / serial number" class="search-input" required autocomplete="off" maxlength="80">
                            <button type="submit" class="search-button" aria-label="Verify item authenticity">
                                <i class="fas fa-search"></i>
                            </button>
                        </form>
                        <div id="serialSearchResult" class="serial-result serial-result-card is-idle" role="status" aria-live="polite" aria-labelledby="serialResultTitle">
                            <div class="serial-result-content serial-result-skeleton">
                                <div id="serialSkeletonImage" class="serial-skeleton-image" aria-hidden="true"></div>
                                <div id="serialSkeletonCopy" class="serial-skeleton-copy" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
                                <div id="serialResultIcon" class="serial-result-icon" hidden><i id="serialResultIconGlyph" class="fa-solid fa-check" aria-hidden="true"></i></div>
                                <h2 id="serialResultTitle">Enter an item code</h2>
                                <p id="serialResultMessage">بيانات القطعة المباعة ستظهر في هذا الكرت.</p>
                                <div id="serialProduct" class="serial-product" hidden>
                                    <picture class="dart-picture"><source srcset="Photos/hero 2.webp" type="image/webp"><img id="serialProductImage" class="serial-product-image" src="Photos/hero 2.png" alt="Dart item verification preview" loading="lazy" decoding="async"></picture>
                                    <div class="serial-product-details">
                                        <div><small>Product</small><strong id="serialProductName"></strong></div>
                                        <div><small>Item Code</small><strong id="serialProductCode"></strong></div>
                                        <div><small>Size</small><strong id="serialProductSize"></strong></div>
                                        <div><small>Color</small><strong id="serialProductColor"></strong></div>
                                        <div class="serial-owner"><small>Registered owner</small><strong id="serialProductOwner"></strong></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </main>
                <footer id="footer" aria-label="footer."></footer>
            </div>

        <script  src="Js/dart-state.js" defer></script>
