<body class='dja-flexdir'>
    <div class="mother">
        <header id="header-container" aria-label="Main Navigation"></header>
            
        <main class="cart-checkout">

            <h1 class="sopping">&nbsp; Shopping cart</h1>
            <p dir="rtl"><i class="fa-solid fa-star"></i> &nbsp;يمكنك الاستبدال او الاسترجاع خلال 14 يوم من تاريخ استلام الاوردر </p>

            <section id="cartView" class="cart-section">
                <div class="cart-items-container" id="cartItemsContainer">
                    <!-- قالب كارت المنتج في السلة -->
                    <div class="cart-product-card" id="cartItemTemplate" style="display: none;">
                        <img src="" alt="" class="cart-product-img">
                        
                        <div class="cart-product-info">
                            <div class="cart-product-title"></div>
                            <div class="cart-product-specs">
                                size : <span class="p-size"></span> &nbsp;|&nbsp; color : <span class="p-color"></span>
                            </div>
                            <div class="cart-product-price-qty">
                                <span class="cart-item-price"></span>
                                <div class="qty-control">
                                    <button class="qty-btn decrease">-</button>
                                    <span class="qty-value">1</span>
                                    <button class="qty-btn increase">+</button>
                                </div>
                            </div>
                            <div class="cart-item-total-price">Total: <span class="p-total"></span> EGP</div>
                        </div>

                        <button class="remove-item-btn">حذف</button>
                    </div>
                </div>

            <!-- زر الانتقال لإتمام الطلب -->
            <button class="primary-btn" id="toCheckoutBtn">Continue to Checkout</button>
        </section>


        <!-- ================= ثانياً: شاشة إتمام الطلب والعنوان (Checkout) (مخفية في البداية) ================= -->
        <section id="checkoutView" class="checkout-section" style="display: none;">
            
            <!-- ملخص المنتج وسعره -->
            <div class="checkout-summary-box" id="checkoutSummaryContainer"></div>

            <!-- خصم الكوبون -->
            <div class="discount-box">
                <input type="text" placeholder="text your Discount" id="discountInput">
                <button id="applyDiscountBtn" type="button">Apply</button>
            </div>

            <div class="totals-calculation">
                <div class="calc-row"><span>Subtotal</span> <span id="subtotalVal">0 EGP</span></div>
                <div class="calc-row"><span>Discount</span> <span id="discountVal">0 EGP</span></div>
                <div class="calc-row total-row"><span>Total</span> <span id="totalVal">0 EGP</span></div>
            </div>

<h3 class="address-header">Address</h3>

<!-- نموذج تفاصيل العنوان -->
<form id="checkoutForm" class="address-form">
    
    <!-- خانة البحث والاقتراحات من جوجل -->
<div class="form-group" style="position: relative;">
    <label>ابحث عن عنوانك</label>
    <input type="text" id="address-input" class="inp" placeholder="اكتب المنطقة أو الشارع..." autocomplete="off">
    <ul id="results-list" class="results-list" style="display:none;"></ul>
</div>

<!-- حاوية الخريطة -->
<div id="map" style="height: 250px; width: 100%; border-radius: 8px; margin: 10px 0; border: 1px solid #ccc; z-index: 1;"></div>

<input type="hidden" id="lat-input" name="latitude">
<input type="hidden" id="lng-input" name="longitude">
<input type="hidden" id="formatted-address-input" name="full_address">

    <div class="form-group"><label>Name</label><input class="inp" type="text" placeholder="Value" required></div>
    <div class="form-group"><label>Phone number</label><input class="inp" type="tel" placeholder="Value" required></div>
    <div class="form-group"><label>Email</label><input class="inp" type="email" placeholder="Value"></div>
    <div class="form-group"><label>Building Number/Name</label><input class="inp" type="text" placeholder="Value" required></div>
    <div class="form-group"><label>Floor</label><input class="inp" type="text" placeholder="Value"></div>
    <div class="form-group"><label>Delivery Notes</label><textarea class="inp" placeholder="Value"></textarea></div>
    <div class="arrwo-for-other-adrees">=== &#9662; Alternative address entry &#9662; ===</div>


    <div class="other-addres">
        <div class="form-group">
            <label>Country</label>
            <select required class="select-cart">
                <option value="" selected disabled hidden> Select </option>
                <option value="Egypt">Egypt</option> 
            </select>                  
        </div>

        <div class="form-group">
            <label>Governorate</label>
            <select class="select-cart" id="governorate-select">
                <option value="" selected disabled hidden> Select </option>
                <option value="Cairo">Cairo</option> 
                <option value="Giza">Giza</option> 
                <option value="Alexandria">Alexandria</option> 
            </select>
        </div>

        <div class="form-group">
            <label>Area</label>
            <input class="inp" type="text" id="area-input" placeholder="المنطقة / الحي">
        </div>

        <div class="form-group">
            <label>Street Name</label>
            <input class="inp" type="text" id="street-input" placeholder="اسم الشارع" >
        </div>
    </div>



    <h3 class="payment-header" style="color: #000;">Payment Method</h3>
<div class="payment-method-box">
    <label class="simple-checkbox">
        <input type="checkbox" checked>
        <span>Cash on Delivery</span>
    </label>
</div>

    <button type="submit" class="order-btn">Order</button>
</form>
